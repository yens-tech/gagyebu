<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가계부</title>
<meta name="theme-color" content="#F7F9F9">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 폰 앱 — 상단 월 이동, 요약 카드 1개, 날짜별 내역, 하단 탭 + 떠 있는 추가 버튼 */
:root{
  --bg:#F7F9F9; --surface:#FFFFFF; --chip:#EEF2F2; --line:#E2E8E7;
  --fg:#1D2626; --muted:#778584; --accent:#0E8A84; --accent-soft:#DFF2EF; --on-accent:#FFFFFF;
  --warn:#C9781F; --over:#C94C43; --sat:#3D6FC4;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1515; --surface:#172020; --chip:#212C2C; --line:#2A3635;
  --fg:#E6EEED; --muted:#8C9B9A; --accent:#3DC0B5; --accent-soft:#163734; --on-accent:#06201E;
  --warn:#E5A052; --over:#EA766C; --sat:#7FA6E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1515; --surface:#172020; --chip:#212C2C; --line:#2A3635;
  --fg:#E6EEED; --muted:#8C9B9A; --accent:#3DC0B5; --accent-soft:#163734; --on-accent:#06201E;
  --warn:#E5A052; --over:#EA766C; --sat:#7FA6E8; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body[data-tab="home"]::before{display:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px}
.month{display:flex;align-items:center;gap:6px}
.month h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;min-width:118px;text-align:center}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:active{background:var(--chip)}
.src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.sum-label{font-size:13px;color:var(--muted)}
.sum-big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sum-big small{font-size:16px;font-weight:600;margin-left:2px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--over)}
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sum-row div{display:grid;gap:2px;min-width:0}
.sum-row b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)} .neg{color:var(--over)}
.hint{font-size:13px;color:var(--muted)}

.example{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.example button{font-weight:600;color:var(--accent);white-space:nowrap}

/* list */
.day{margin-top:22px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--chip)}
.ic{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--fg)}
.ic.in{background:var(--accent-soft);color:var(--accent)}
.item-t{flex:1;min-width:0}
.item-t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t span{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.who{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-right:4px}
.empty{margin-top:40px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}

/* analysis */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 8px;margin-top:12px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow span{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 8px}
.cal-dow span:first-child,.cell.sun .d{color:var(--over)}
.cal-dow span:last-child,.cell.sat .d{color:var(--sat)}
.cell{display:grid;align-content:start;justify-items:center;gap:1px;min-height:62px;padding:5px 1px;border-radius:12px;min-width:0}
.cell .d{font-size:14px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--chip);font-weight:700}
.cell.sel{background:var(--accent-soft)}
.cell.sel .d{background:var(--accent);color:var(--on-accent)}
.cell small{font-size:10.5px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.cell .o{color:var(--fg)} .cell .p{color:var(--accent)}
.cell.blank{visibility:hidden}
.cal-sum{display:flex;justify-content:space-between;gap:8px;padding:10px 4px 0;font-size:13px;color:var(--muted)}
.sec-h{margin:26px 4px 10px;font-size:15px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.crow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow .bar{height:6px;margin-top:6px}
.crow-t{min-width:0;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.crow-t span{color:var(--muted);font-size:12.5px}
.delta{font-size:12px;text-align:right;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.split div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0}

/* settings */
.field{display:grid;gap:6px;padding:14px 0}
.field+.field{border-top:1px solid var(--line)}
.field label{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--over)}
.btn.danger.armed{background:var(--over);color:var(--on-accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.small{font-size:12.5px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;position:relative}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
.tab.on{color:var(--accent)}
.fab{display:none;position:absolute;right:4px;top:-76px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,138,132,.32)}
.fab svg.i{width:28px;height:28px;stroke-width:2}

/* sheet (입력 화면) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-block:6px}
.seg{display:flex;justify-content:center;gap:18px;font-size:19px;font-weight:600}
.seg button{color:var(--muted);padding:4px 2px;border-bottom:2px solid transparent}
.seg button.on{color:var(--accent);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row .i{color:var(--muted)}
.row input{flex:1;min-width:0;border:0;background:none;font-size:17px;padding:4px 0}
.row input:focus{outline:none}
.amount-in{font-size:26px!important;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 4px 0}
.quick button{font-size:13px;padding:6px 10px;border-radius:99px;background:var(--chip)}
.people{display:flex;gap:8px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pchip{padding:8px 16px;border-radius:99px;background:var(--chip);font-weight:500}
.pchip.on{background:var(--accent);color:var(--on-accent)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 4px 0}
.sugg button{font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:22px 0 8px}
.cat{display:grid;justify-items:center;gap:7px;font-size:13px}
.cat .ic{width:58px;height:58px}
.cat .ic svg.i{width:27px;height:27px}
.cat.on .ic{background:var(--accent);color:var(--on-accent)}
.cat.on{color:var(--accent);font-weight:600}
.save-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.save-bar-in{max-width:520px;margin:0 auto;display:flex;gap:8px}
.save-bar .btn{flex:1;padding:15px}
.save-bar .btn.danger{flex:0 0 auto}
.err{color:var(--over);font-size:13px;padding:8px 4px 0;min-height:1px}

.scan{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0 4px;padding:14px;border-radius:14px;border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft);text-align:left}
.scan b{display:block;font-weight:600}
.scan span{font-size:12.5px;color:var(--muted)}
.scan[disabled]{opacity:.7;cursor:progress}
.scan-msg{font-size:13px;padding:6px 4px 0;color:var(--muted)}
.scan-msg.ok{color:var(--accent)} .scan-msg.bad{color:var(--over)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.scan2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scan2 .scan{flex-direction:column;align-items:center;text-align:center;padding:12px 6px;gap:6px;margin:6px 0 4px}
.scan2 .scan b{font-size:14px}
.scan2 .scan span span{font-size:11.5px}
.cap-h{font-size:18px;font-weight:700;text-align:center}
.cap-info{display:grid;justify-items:center;gap:10px;padding:48px 0;color:var(--muted);text-align:center}
.cap-sum{padding:10px 4px;font-size:14px;color:var(--muted)}
.cap-sum b{color:var(--fg)}
.cap-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.crec{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px;align-items:start}
.crec+.crec{border-top:1px solid var(--line)}
.crec.off{opacity:.5}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-accent);margin-top:4px}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck svg.i{width:16px;height:16px;stroke-width:2.4}
.crec-b{display:grid;gap:6px;min-width:0}
.crec-r{display:flex;gap:6px;align-items:center;min-width:0}
.crec input,.crec select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:15px;min-width:0;color:var(--fg)}
.crec .m{flex:1}
.crec .a{width:104px;text-align:right}
.crec .dt{width:140px}
.crec select{flex:1}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.segm button{padding:6px 9px;font-size:13px;color:var(--muted);background:var(--bg)}
.segm button+button{border-left:1px solid var(--line)}
.segm button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.crec .dt{flex:1;width:auto}
.flag{font-size:12px;color:var(--warn)}
.top.center{justify-content:center;padding-block:16px 12px}
.top.center h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em}
.top-actions{display:flex;gap:2px}
.dday{font-size:22px;font-weight:600;text-align:center;padding-block:16px 12px;letter-spacing:.01em}
.hero.has .dday{position:absolute;inset:0 0 auto;z-index:2;color:#fff;padding-top:18px;padding-bottom:40px;text-shadow:0 1px 8px rgba(0,0,0,.35);background:linear-gradient(rgba(0,0,0,.28),transparent);pointer-events:none}
.hero{position:relative;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:4/5;max-height:66vh;background:var(--chip)}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;max-width:none}
.hero-btns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:grid;gap:10px}
.hero-btns button.armed{background:var(--over)}
.hero-btns button{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--accent) 70%,transparent);color:#fff;display:grid;place-items:center;backdrop-filter:blur(4px)}
.dots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.6)}
.dots i.on{background:var(--accent)}
.hero-empty{aspect-ratio:4/5;max-height:56vh;display:grid;place-items:center;align-content:center;gap:12px;background:var(--chip);color:var(--muted);text-align:center;padding:24px}
.hero-empty .btn{background:var(--accent);color:var(--on-accent)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding:14px 8px;border-radius:var(--r);background:var(--chip);text-align:center}
.mini div{display:grid;gap:2px;min-width:0}
.mini span{font-size:12.5px;color:var(--muted)}
.mini b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal2{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-top:14px;border-top:1px solid var(--line)}
.cal2 .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);padding-inline:4px}
.c2{display:grid;justify-items:center;align-content:start;gap:4px;min-height:66px;padding:8px 0 6px;min-width:0}
.c2 .d{font-size:15px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.c2.sun .d{color:var(--over)} .c2.sat .d{color:var(--sat)}
.c2.today .d{font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.c2.sel .d{background:var(--fg);color:var(--bg);font-weight:600;box-shadow:none}
.c2 small{font-size:10.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.03em}
.c2 small.p{color:var(--accent)}
.c2.blank{pointer-events:none}
.c2.blank .d{visibility:hidden}
.reg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--fg);color:var(--bg);font-weight:600;font-size:16px;padding:15px 40px;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
.reg svg.i{width:20px;height:20px;stroke-width:2}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.thumb{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--chip)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.thumb button.armed{background:var(--over);width:auto;padding:0 8px;font-size:11px;border-radius:99px}
.thumb button svg.i{width:14px;height:14px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;transition:opacity .2s}
.login{min-height:80vh;display:grid;align-content:center;gap:12px;max-width:360px;margin:0 auto}
.login h1{margin:0 0 4px;font-size:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const APP_VERSION='2026.11.05-17';
const THEME_LS='gagyebu.theme';
function applyTheme(){ let t='light'; try{ t=localStorage.getItem(THEME_LS)||'light'; }catch(e){}
  if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; return t; }
applyTheme();
/* ---------------- 아이콘 (직접 그린 선 아이콘) ---------------- */
const IC = {
  food:"M7 3v7M4.5 3v4.5a2.5 2.5 0 0 0 5 0V3M7 10v11M17 21V3c-2.2 1-3.5 4-3.5 8H17",
  cafe:"M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H15.5M8.5 3.5v2.5M12 3.5v2.5",

/* ---------------- 유틸 ---------------- */
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymd(d){ return ym(d)+'-'+String(d.getDate()).padStart(2,'0'); }
const won = n => Math.round(n).toLocaleString('ko-KR');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const $ = s => document.querySelector(s);
function catsOf(type){ const base = type==='in'?IN_CATS:OUT_CATS; const extra=(S.settings.customCats||[]).filter(c=>c.type===type).map(c=>[c.key,c.label]); const last=base[base.length-1]; return [...base.slice(0,-1),...extra,last]; }
function catInfo(key){ const all=[...OUT_CATS,...IN_CATS,...(S.settings.customCats||[]).map(c=>[c.key,c.label])]; const f=all.find(c=>c[0]===key); return {key, label:f?f[1]:'기타', icon: IC[key]?key:'tag'}; }
function whoName(w){ return w==='a'?S.settings.names.a : w==='b'?S.settings.names.b : '우리'; }
function monthLabel(m){ const [y,mo]=m.split('-'); return `${y}년 ${+mo}월`; }
function shiftMonth(m,d){ const [y,mo]=m.split('-').map(Number); return ym(new Date(y,mo-1+d,1)); }
const DOW = ['일','월','화','수','목','금','토'];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1600); }

/* ---------------- 저장소: 기기 저장 ---------------- */
const LocalStore = {
  load(){
    let d=null; try{ d=JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
    if(d){ S.txs=d.txs||[]; S.settings={...structuredClone(DEFAULT_SETTINGS),...d.settings}; }
    else { S.txs=sampleData(); this.persist(); }
    try{ S.photos=JSON.parse(localStorage.getItem(LS_KEY+'.photos'))||[]; }catch(e){}
  },
  persistPhotos(){ try{ localStorage.setItem(LS_KEY+'.photos', JSON.stringify(S.photos)); return true; }catch(e){ return false; } },
  async addPhoto(p){ S.photos.push(p); if(!this.persistPhotos()){ S.photos.pop(); throw {code:'full'}; } render(); },
  async removePhoto(id){ S.photos=S.photos.filter(p=>p.id!==id); this.persistPhotos(); render(); },
  persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({txs:S.txs, settings:S.settings})); }catch(e){} },
  async put(tx){ const i=S.txs.findIndex(t=>t.id===tx.id); if(i>=0) S.txs[i]=tx; else S.txs.push(tx); this.persist(); render(); },
  async putMany(txs){ S.txs.push(...txs); this.persist(); render(); },
  async remove(id){ S.txs=S.txs.filter(t=>t.id!==id); this.persist(); render(); },
  async removeMany(ids){ const set=new Set(ids); S.txs=S.txs.filter(t=>!set.has(t.id)); this.persist(); render(); },
  async saveSettings(s){ S.settings=s; this.persist(); render(); }
};

/* ---------------- 저장소: Firebase (부부 공유) ---------------- */
const FireStore = {
  db:null, auth:null, unsub:[],
  async init(){
    const v='10.12.2', base=`https://www.gstatic.com/firebasejs/${v}/`;
    const load = src => new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
    try{
      await load(base+'firebase-app-compat.js');
      await Promise.all([load(base+'firebase-auth-compat.js'), load(base+'firebase-firestore-compat.js')]);
    }catch(e){ S.fbError='Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; S.ready=true; render(); return; }
    firebase.initializeApp(CFG.firebase);
    this.auth=firebase.auth(); this.db=firebase.firestore();
    this.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    this.auth.onAuthStateChanged(u=>{ S.user=u; S.ready=true; this.unsub.forEach(f=>f()); this.unsub=[]; if(u) this.listen(); render(); });
  },
  home(){ return this.db.collection('households').doc(CFG.householdId||'our-home'); },
  listen(){
    this.unsub.push(this.home().collection('tx').onSnapshot(snap=>{ S.txs=snap.docs.map(d=>d.data()); render(); }, err=>{ S.fbError='데이터를 읽을 권한이 없어요. 보안 규칙에 두 사람 이메일을 넣었는지 확인해 주세요.'; render(); }));
    this.unsub.push(this.home().collection('photos').orderBy('createdAt').onSnapshot(snap=>{ S.photos=snap.docs.map(d=>d.data()); render(); }, ()=>{}));
    this.unsub.push(this.home().onSnapshot(d=>{ const s=d.exists?d.data().settings:null; if(s) S.settings={...structuredClone(DEFAULT_SETTINGS),...s}; render(); }, ()=>{}));
  },
  async put(tx){ tx.by=S.user?.email||''; await this.home().collection('tx').doc(tx.id).set(tx); },
  async putMany(txs){ const b=this.db.batch(); txs.forEach(t=>{ t.by=S.user?.email||''; b.set(this.home().collection('tx').doc(t.id), t); }); await b.commit(); },
  async remove(id){ await this.home().collection('tx').doc(id).delete(); },
  async removeMany(ids){ const b=this.db.batch(); ids.forEach(id=>b.delete(this.home().collection('tx').doc(id))); await b.commit(); },
  async saveSettings(s){ await this.home().set({settings:s},{merge:true}); },
  async addPhoto(p){ await this.home().collection('photos').doc(p.id).set(p); },
  async removePhoto(id){ await this.home().collection('photos').doc(id).delete(); },
  async login(email,pw){ await this.auth.signInWithEmailAndPassword(email,pw); },
  async logout(){ await this.auth.signOut(); }
};
const store = () => S.source==='firebase' ? FireStore : LocalStore;

/* ---------------- 계산 ---------------- */
function monthTx(m){ return S.txs.filter(t=>t.date&&t.date.startsWith(m)); }
function totals(m){ let out=0,inc=0; monthTx(m).forEach(t=>t.type==='in'?inc+=t.amount:out+=t.amount); return {out,inc}; }

/* ---------------- 화면 그리기 ---------------- */
function render(){
  const app=$('#app');
  if(S.source==='firebase' && !S.ready){ app.innerHTML='<div class="empty" style="margin-top:40vh">불러오는 중…</div>'; $('#tabs').hidden=true; return; }
  if(S.source==='firebase' && !S.user && !S.fbError){ app.innerHTML=loginView(); $('#tabs').hidden=true; bindLogin(); return; }
  $('#tabs').hidden=false; renderTabs(); document.body.dataset.tab=S.tab;
  const monthNav = `<div class="month">
      <button class="iconbtn" data-act="prev" aria-label="이전 달">${svg('back')}</button>
      <h1>${monthLabel(S.month)}</h1>
      <button class="iconbtn" data-act="next" aria-label="다음 달">${svg('next')}</button></div>`;
  const head = S.tab==='home' ? ''
    : S.tab==='settings' ? `<header class="top"><div class="month"><h1 style="text-align:left;min-width:0">설정</h1></div></header>`
    : `<header class="top">${monthNav}${S.tab==='book'?`<div class="top-actions"><button class="iconbtn" data-act="bookmode" aria-label="${S.bookMode==='cal'?'목록으로 보기':'달력으로 보기'}">${svg(S.bookMode==='cal'?'list':'cal')}</button></div>`:''}</header>`;
  const err = S.fbError ? `<div class="example" style="background:var(--chip);color:var(--over)">${esc(S.fbError)}</div>` : '';
  app.innerHTML = head + err + (S.tab==='home'?homeView():S.tab==='book'?(S.bookMode==='cal'?calendarView():listView()):S.tab==='stats'?statsView():settingsView());
  if(S.tab==='home') bindHome();
  if(S.tab==='settings') bindSettings();
}

function summaryCard(){
  const {out,inc}=totals(S.month), budget=S.settings.budget||0, left=budget-out, pct=budget?Math.min(100,out/budget*100):0;
  const cls = !budget?'':out>budget?'over':pct>=80?'warn':'';
  const now=new Date(), isCur=S.month===ym(now);
  const daysIn=new Date(+S.month.slice(0,4), +S.month.slice(5), 0).getDate(), daysLeft=isCur?daysIn-now.getDate()+1:0;
  const perDay = isCur && left>0 ? `남은 ${daysLeft}일 동안 하루 <b class="num">${won(left/daysLeft)}원</b>씩 쓸 수 있어요` :
    budget && left<0 ? `예산보다 <b class="num neg">${won(-left)}원</b> 더 썼어요` : budget ? `예산 ${won(budget)}원 기준` : '설정에서 월 예산을 정하면 남은 금액을 보여드려요';
  return `<section class="sum">
    <div><div class="sum-label">이번 달 지출</div><div class="sum-big num">${won(out)}<small>원</small></div></div>
    ${budget?`<div class="bar ${cls}"><i style="width:${pct}%"></i></div>`:''}
    <div class="hint">${perDay}</div>
    <div class="sum-row">
      <div><span class="sum-label">수입</span><b class="num pos">${won(inc)}</b></div>
      <div><span class="sum-label">남은 예산</span><b class="num ${left<0?'neg':''}">${budget?won(left):'-'}</b></div>
      <div><span class="sum-label">수입−지출</span><b class="num">${won(inc-out)}</b></div>
    </div>
  </section>`;
}

const short = n => n>=10000 ? (Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'만' : won(n);

function miniSummary(){
  const {out,inc}=totals(S.month), b=S.settings.budget||0;
  return `<div class="mini"><div><span>입금</span><b class="num pos">+${won(inc)}원</b></div>
    <div><span>지출${b?` (예산 ${Math.round(out/b*100)}%)`:''}</span><b class="num">−${won(out)}원</b></div>
    <div><span>잔액</span><b class="num ${inc-out<0?'neg':''}">${inc-out<0?'−':''}${won(Math.abs(inc-out))}원</b></div></div>`;
}
const calAmt = n => n>=1000000 ? short(n) : won(n);
function calendarView(){
  const [y,m]=S.month.split('-').map(Number), first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  const today=ymd(new Date());
  if(!S.selDay || !S.selDay.startsWith(S.month)) S.selDay = today.startsWith(S.month) ? today : S.month+'-01';
  const per={}; monthTx(S.month).forEach(t=>{ const d=per[t.date]=per[t.date]||{o:0,i:0}; t.type==='in'?d.i+=t.amount:d.o+=t.amount; });
  const cells=[]; for(let i=0;i<first;i++) cells.push('<span class="c2 blank"><span class="d">0</span></span>');
  for(let d=1; d<=days; d++){
    const key=`${S.month}-${String(d).padStart(2,'0')}`, v=per[key], dow=(first+d-1)%7;
    cells.push(`<button class="c2 ${dow===0?'sun':dow===6?'sat':''} ${key===today?'today':''} ${key===S.selDay?'sel':''}" data-day="${key}" aria-label="${d}일">
      <span class="d num">${d}</span>${v&&v.i?`<small class="p num">+${calAmt(v.i)}</small>`:''}${v&&v.o?`<small class="num">−${calAmt(v.o)}</small>`:''}</button>`);
  }
  while(cells.length%7) cells.push('<span class="c2 blank"><span class="d">0</span></span>');
  let weeks=''; for(let i=0;i<cells.length;i+=7) weeks+=`<div class="wk">${cells.slice(i,i+7).join('')}</div>`;
  const sel=monthTx(S.month).filter(t=>t.date===S.selDay).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const so=sel.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0), si=sel.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const sd=new Date(S.selDay+'T00:00');
  let html=miniSummary()+`<section class="cal2">${weeks}</section>`;
  html+=`<div class="day"><div class="day-h"><span>${sd.getMonth()+1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일</span><span class="num">${si?`<span class="pos">+${won(si)}원</span> `:''}${so?'−'+won(so)+'원':''}</span></div>`;
  html+= sel.length ? `<div class="items">${sel.map(itemRow).join('')}</div>` : `<div class="empty" style="margin-top:14px"><div>이날은 기록이 없어요.</div><div class="small">아래 가계부 등록을 누르면 이 날짜로 입력돼요.</div></div>`;
  return html+'</div>';
}

function ddayText(){
  const a=S.settings.anniv; if(!a) return '우리 가계부';
  const diff=Math.round((new Date(ymd(new Date())+'T00:00') - new Date(a+'T00:00'))/86400000);
  return diff>=0 ? `D+${diff}` : `D${diff}`;
}
function homeView(){
  const ph=S.photos||[]; if(S.photoIdx>=ph.length) S.photoIdx=0;
  let html=`<section class="hero ${ph.length?'has':''}"><div class="dday num">${esc(ddayText())}</div>`;
  if(ph.length){
    html+=`<div class="slides" id="slides">${ph.map(p=>`<img src="${p.data}" alt="우리 사진">`).join('')}</div>
      ${ph.length>1?`<div class="dots">${ph.map((p,i)=>`<i class="${i===S.photoIdx?'on':''}"></i>`).join('')}</div>`:''}

function bindHome(){
  const sl=$('#slides'); if(sl){ if(S.photoIdx) sl.scrollLeft=sl.clientWidth*S.photoIdx;
    sl.onscroll=()=>{ const i=Math.round(sl.scrollLeft/sl.clientWidth); if(i!==S.photoIdx){ S.photoIdx=i; document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i)); } }; }
  const inp=$('#ph-in'); if(inp) inp.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f) addPhoto(f); };
}
async function photoData(file){
  const bmp=await createImageBitmap(file), k=Math.min(1,1080/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  for(const q of [0.82,0.7,0.55]){ const d=c.toDataURL('image/jpeg',q); if(d.length<700000) return d; }
  return c.toDataURL('image/jpeg',0.45);
}
async function addPhoto(file){
  if((S.photos||[]).length>=10){ toast('사진은 10장까지 넣을 수 있어요'); return; }
  toast('사진을 올리는 중…');
  try{ const data=await photoData(file); await store().addPhoto({id:uid(), data, createdAt:Date.now()}); S.photoIdx=S.photos.length-1; toast('사진을 넣었어요'); render(); }
  catch(e){ toast(e&&e.code==='full'?'이 기기 저장 공간이 부족해요':'사진을 넣지 못했어요. 다시 시도해 주세요'); }
}

function listView(){
  const tx=monthTx(S.month).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const hasEx=S.txs.some(t=>t.ex);
  let html=summaryCard();
  if(hasEx) html+=`<div class="example"><span>지금 보이는 내역은 예시예요.</span><button data-act="clear-ex">예시 지우고 시작</button></div>`;
  if(!tx.length) return html+`<div class="empty">${svg('memo')}<div>이 달에는 아직 기록이 없어요.</div><div class="small">아래 + 버튼으로 첫 내역을 남겨보세요.</div></div>`;
  const byDay={}; tx.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
  for(const d of Object.keys(byDay)){
    const list=byDay[d], dt=new Date(d+'T00:00'), dayOut=list.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
    html+=`<div class="day"><div class="day-h"><span>${dt.getDate()}일 ${DOW[dt.getDay()]}요일</span><span class="num">${dayOut?'−'+won(dayOut)+'원':''}</span></div><div class="items">`;
    html+=list.map(itemRow).join('');
    html+='</div></div>';
  }
  return html;
}

function statsView(){
  const cur=monthTx(S.month).filter(t=>t.type==='out'), prev=monthTx(shiftMonth(S.month,-1)).filter(t=>t.type==='out');
  const sum=(arr,f)=>arr.reduce((m,t)=>(m[f(t)]=(m[f(t)]||0)+t.amount,m),{});
  const byCat=sum(cur,t=>t.cat), prevCat=sum(prev,t=>t.cat), total=cur.reduce((s,t)=>s+t.amount,0);
  const rows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byWho=sum(cur,t=>t.who);
  let html=summaryCard();
  html+=`<h2 class="sec-h">누가 썼나</h2><div class="split">${['a','b','us'].map(w=>`<div><span class="sum-label">${esc(whoName(w))}</span><b class="num">${won(byWho[w]||0)}</b><span class="small num">${total?Math.round((byWho[w]||0)/total*100):0}%</span></div>`).join('')}</div>`;
  html+=`<h2 class="sec-h">카테고리별 지출</h2>`;
  if(!rows.length) return html+`<div class="empty"><div>이 달 지출이 없어요.</div></div>`;
  html+='<div class="card">'+rows.map(([k,v])=>{ const c=catInfo(k), p=prevCat[k]||0, d=v-p;
    const dtxt = p? (d>0?`지난달보다 +${won(d)}`:d<0?`지난달보다 −${won(-d)}`:'지난달과 같음') : '지난달 없음';
    return `<div class="crow"><span class="ic">${svg(c.icon)}</span>
      <div style="min-width:0"><div class="crow-t"><b style="font-weight:500">${esc(c.label)}</b><span class="num">${Math.round(v/total*100)}%</span></div><div class="bar"><i style="width:${v/rows[0][1]*100}%"></i></div></div>
      <div><div class="num" style="font-weight:600;text-align:right">${won(v)}</div><div class="delta num ${d>0&&p?'neg':''}">${dtxt}</div></div></div>`; }).join('')+'</div>';
  return html;
}

function memoSuggestions(){
  const q=(F.memo||'').trim(), freq={};
  S.txs.forEach(t=>{ if(!t.memo||t.type!==F.type) return; if(F.cat&&t.cat!==F.cat) return; if(q&&!t.memo.includes(q)) return; if(t.memo===q) return; freq[t.memo]=(freq[t.memo]||0)+1; });

}

async function listGeminiModels(key){
  let r; try{ r=await tfetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`,{},10000); }catch(e){ throw {code:e&&e.code==='timeout'?'timeout':'net'}; }
  if(r.status===400||r.status===401||r.status===403) throw {code:'key'};
  if(!r.ok) throw {code:'api', detail:`모델 목록 ${r.status}`};

  const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/gemini/.test(n) && !/image|tts|live|audio|embedding|robotics|computer/.test(n));

  const list=names.sort((a,b)=>score(b)-score(a)).slice(0,6);
  if(!list.length) throw {code:'api', detail:'쓸 수 있는 모델이 없어요'};
  try{ localStorage.setItem(GEM_LIST_LS, JSON.stringify({at:Date.now(), list})); }catch(e){}
  return list;
}
async function geminiModels(key){
  if(CFG.geminiModel) return [CFG.geminiModel];

  const list = cached && cached.list && Date.now()-cached.at < 7*86400000 ? cached.list : await listGeminiModels(key);
  let pref=''; try{ pref=localStorage.getItem(GEM_MODEL_LS)||''; }catch(e){}
  let ordered = pref && list.includes(pref) ? [pref, ...list.filter(m=>m!==pref)] : list;
  let busy={}; try{ busy=JSON.parse(localStorage.getItem(GEM_BUSY_LS))||{}; }catch(e){}
  const now=Date.now(), hot=m=>busy[m] && now-busy[m]<600000;

}

async function readWithGemini(blob, key, prompt=receiptPrompt(), onStatus=()=>{}){
  const b64=await blobToB64(blob);
  let models=await geminiModels(key), last=null, refreshed=false;
  const tries=[...models.slice(0,4), ...models.slice(0,2)]; let waited=false;
  for(let mi=0; mi<tries.length; mi++){
    const model=tries[mi];
    if(mi===Math.min(4,models.length) && !waited){ waited=true; onStatus('모든 모델이 붐벼요. 잠깐 기다렸다 다시 시도하는 중…'); await sleep(4000); }
    for(let attempt=0; attempt<1; attempt++){
      let r;
      try{
        r = await tfetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ contents:[{parts:[{text:prompt},{inline_data:{mime_type:blob.type||'image/jpeg', data:b64}}]}],
            generationConfig:Object.assign({ responseMimeType:'application/json', temperature:0 }, thinkCfg(model)?{thinkingConfig:thinkCfg(model)}:{}) })
        }, 20000);
      }catch(e){ if(e&&e.code==='timeout'){ last={code:'timeout'}; markBusy(model); onStatus(`${model} 응답이 늦어서 다른 모델로 바꾸는 중…`); break; } last={code:'net'}; break; }
      let j=null; try{ j=await r.json(); }catch(e){}
      if(r.ok){
        const text=(j?.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
        if(!text){ last={code:'api', detail: j?.promptFeedback?.blockReason ? `차단됨: ${j.promptFeedback.blockReason}` : '빈 응답'}; break; }
        try{ const out=parseJson(text); try{ localStorage.setItem(GEM_MODEL_LS, model); }catch(e){} return out; }
        catch(e){ last={code:'api', detail:'응답을 해석하지 못함'}; break; }
      }
      const msg=j?.error?.message||'';
      if(r.status===400 && /thinking/i.test(msg) && thinkCfg(model)){ try{ const o=localStorage.getItem(GEM_NOTHINK_LS)||''; localStorage.setItem(GEM_NOTHINK_LS, o?o+','+model:model); }catch(e){} attempt--; continue; }
      if(r.status===404){ if(!refreshed){ refreshed=true; try{ localStorage.removeItem(GEM_LIST_LS); }catch(e){} models=await listGeminiModels(key); tries.splice(0,tries.length,...models.slice(0,4),...models.slice(0,2)); mi=-1; } last={code:'api',detail:`404 ${msg}`}; break; }
      if(r.status===401||r.status===403||/API key|API_KEY/i.test(msg)) throw {code:'key', detail:msg};
      if(r.status===429){ last={code:'limit'}; break; }            // 이 모델 오늘 한도 → 다음 모델
      if(r.status===503||r.status===500||r.status===504){            // 서버 붐빔 → 잠깐 쉬고 재시도, 그다음 다른 모델
        last={code:'busy'}; markBusy(model); onStatus(`${model} 이(가) 붐벼서 다른 모델로 바꾸는 중…`); break; }
      throw {code:'api', detail:`${r.status} ${msg}`.trim()};
    }
  }
  throw last||{code:'api'};
}

const norm = s => String(s||'').replace(/\(주\)|주식회사|㈜|\s|[·.,\-_()]/g,'').toLowerCase();
const sameText = (a,b) => { a=norm(a); b=norm(b); if(!a||!b) return true; return a.includes(b)||b.includes(a)||a.slice(0,4)===b.slice(0,4); };
function catFromHistory(merchant,type){ const n=norm(merchant); if(!n) return ''; const t=S.txs.find(x=>x.type===type&&!x.ex&&x.memo&&sameText(x.memo,merchant)&&norm(x.memo).slice(0,4)===n.slice(0,4)); return t?t.cat:''; }

/* ---------------- 텍스트 붙여넣기 (폰의 글자 복사 기능) ---------------- */
const KW=[[/카드대금|카드결제대금|결제대금/,'card_bill'],
  [/GS25|지에스25|씨유|\bCU\b|세븐일레븐|이마트24|미니스톱|emart24/i,'conv'],[/배달의민족|배민|쿠팡이츠|요기요|땡겨요/,'delivery'],
  [/스타벅스|커피|카페|투썸|메가엠지씨|메가커피|빽다방|이디야|컴포즈|폴바셋|할리스|파스쿠찌|파리바게|뚜레쥬르|베이커리|던킨|배스킨/,'cafe'],
  [/이마트|홈플러스|롯데마트|코스트코|트레이더스|다이소|쿠팡|컬리|노브랜드|하나로마트|농협|오아시스/,'mart'],
  [/택시|카카오T|티머니|코레일|KTX|SRT|지하철|버스|후불교통|교통/,'transport'],[/주유|에너지|칼텍스|S-OIL|에쓰오일|오일뱅크|주차|하이패스/,'car'],
  [/병원|의원|약국|치과|한의원|안과|피부과|정형외과/,'health'],[/넷플릭스|NETFLIX|유튜브|YOUTUBE|스포티파이|디즈니|티빙|웨이브|멜론|쿠팡와우|APPLE\.COM|구글플레이/i,'subs'],
  [/SKT|SK텔레콤|LG유플러스|U\+|알뜰폰|\bKT\b/,'telecom'],[/관리비|한국전력|한전|도시가스|수도/,'utility'],[/CGV|메가박스|롯데시네마|교보|예스24|알라딘|영풍/,'culture'],
  [/올리브영|미용실|헤어|네일/,'beauty'],[/무신사|지그재그|에이블리|29CM|유니클로|자라|ZARA|탑텐|스파오/i,'fashion'],
  [/호텔|항공|여기어때|야놀자|아고다|에어비앤비|트립닷컴/i,'travel'],[/보험|생명|화재|손해/,'insurance'],
  [/호프|포차|주점|이자카야|와인|맥주/,'alcohol'],
  [/식당|국밥|김밥|맥도날드|버거킹|롯데리아|맘스터치|서브웨이|분식|치킨|피자|족발|고기|식육|횟집|초밥|스시|라멘|국수|반점|짬뽕|한식|중식|일식|푸드|키친/,'food']];
function kwCat(t,type){ if(type==='in'){ if(/급여|월급|상여|SALARY/i.test(t)) return 'salary'; if(/이자|배당/.test(t)) return 'interest'; if(/환급|환불/.test(t)) return 'refund'; return 'etc_in'; }
  for(const [re,c] of KW) if(re.test(t)) return c; return 'etc'; }
function maskNumbers(t){
  return String(t||'')
    .replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{1,4}\b/g,'****-****')                // 카드번호
    .replace(/\b\d{2,6}[-*]{1,3}[\d*]{2,6}[-*]{1,3}[\d*]{2,8}(?:[-*][\d*]{1,6})?\b/g,'***-****')  // 계좌번호
    .replace(/(?<![\d,.])\d{10,16}(?![\d,])/g,'**********')                               // 붙어 있는 긴 숫자
    .replace(/(잔액|누적)[ \t]*[\d,]+[ \t]*원?/g,'$1 ***');
}
function parseText(raw){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth()+1;
  const mk=(y,m,d)=>{ if(!y) y = m>M ? Y-1 : Y; if(y<100) y+=2000; return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; };
  const dateOf=l=>{ let m;
    if((m=l.match(/(20\d{2}|\d{2})[.\-/년]\s*(\d{1,2})[.\-/월]\s*(\d{1,2})/))) return mk(+m[1],+m[2],+m[3]);
    if((m=l.match(/(\d{1,2})월\s*(\d{1,2})일/))) return mk(0,+m[1],+m[2]);
    if((m=l.match(/(?:^|\s|\[KB\])(\d{1,2})[./](\d{1,2})(?![\d,])/)) && +m[1]<=12 && +m[2]<=31) return mk(0,+m[1],+m[2]);
    if(/^오늘\b/.test(l)) return ymd(now);
    if(/^어제\b/.test(l)){ const d=new Date(now); d.setDate(d.getDate()-1); return ymd(d); }
    return ''; };
  const META=/잔액|누적|한도|포인트|적립|할인|일시불|할부|개월|승인|체크카드|신용카드|국민카드|KB국민|KB\s?Pay|Web발신|^\[|이용내역|거래내역|전체|조회|^\d{1,2}:\d{2}|^[\d*\-]{6,}$|\*/;
  const amtOf=l=>{ if(/잔액|누적|한도|포인트|적립/.test(l)) return null; const m=l.match(/^([+\-−]?)\s*([\d]{1,3}(?:,\d{3})+|\d+)\s*원?$/)||l.match(/([+\-−]?)\s*([\d]{1,3}(?:,\d{3})+|\d{3,})\s*원/); if(!m) return null;
    const v=+m[2].replace(/,/g,''); return v>0&&v<100000000 ? {v, sign:m[1]} : null; };
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let cur=ymd(now), seen=false; const out=[];
  const recs=[];  // [{i, amt, sign, date}]
  lines.forEach((l,i)=>{ const d=dateOf(l); if(d){ cur=d; seen=true; } const a=amtOf(l); if(a && !(d && !/원/.test(l))) recs.push({i, amt:a.v, sign:a.sign, date:cur, seen}); });
  recs.forEach((r,k)=>{
    const from=k?recs[k-1].i+1:0, to=k<recs.length-1?recs[k+1].i:lines.length;
    const isText=l=>!META.test(l) && !dateOf(l) && !amtOf(l) && /[가-힣A-Za-z]/.test(l) && !/^(입금|출금|지출|수입|결제|취소)$/.test(l) && l.length<=40;
    let merchant=''; for(let j=r.i-1;j>=from;j--){ if(isText(lines[j])){ merchant=lines[j]; break; } }
    if(!merchant && !r.seen) for(let j=r.i+1;j<to;j++){ if(isText(lines[j])){ merchant=lines[j]; break; } }
    const ctx=lines.slice(from, Math.min(to,r.i+2)).join(' ');
    let date=r.date; if(!r.seen){ for(let j=r.i+1;j<to;j++){ const d=dateOf(lines[j]); if(d){ date=d; break; } } }   // 문자처럼 날짜가 금액 뒤에 오는 경우
    const cancel=/취소/.test(ctx);
    const isIn = cancel || r.sign==='+' || r.sign==='-' || r.sign==='−' || (/입금|환불|받음|급여/.test(ctx) && !/출금|결제|승인/.test(ctx));
    let kind = (cancel||r.sign==='-'||r.sign==='−')?'cancel': (/카드대금|결제대금/.test(merchant+ctx) || (/카드/.test(ctx)&&/출금/.test(ctx)&&!/승인/.test(ctx)))?'card_bill':'pay';
    if(kind==='card_bill'&&!merchant) merchant='카드대금';
    const nm=[S.settings.names.a,S.settings.names.b].filter(Boolean);
    if(kind==='pay' && (/이체|송금/.test(ctx) || nm.some(n=>merchant.includes(n)))) kind='transfer';
    let cat=kwCat(merchant, isIn?'in':'out'); if(isIn && cat==='etc_in' && /\(주\)|주식회사|㈜/.test(merchant) && r.amt>=500000) cat='salary';
    out.push({date, merchant: merchant.replace(/\s*(결제|사용|승인)$/,''), amount:r.amt, type:isIn?'in':'out', kind, category:cat});
  });
  return out;
}
function openPaste(who){ R={status:'paste', mode:'paste', who:who||S.lastWho||'us', items:[], removed:0, err:'', text:''}; $('#sheet').hidden=false; document.body.style.overflow='hidden'; drawCapture(); setTimeout(()=>{ const ta=$('#cap-text'); if(ta){ ta.focus(); ta.addEventListener('paste',()=>setTimeout(()=>{ ta.value=maskNumbers(ta.value); },0)); } },50); }
function readPasted(){
  R.text=maskNumbers($('#cap-text').value); $('#cap-text').value=R.text; const raw=parseText(R.text);
  R.items=[]; R.removed=0; R.err=''; buildReview(raw); R.status='review';
  if(!R.items.length && !R.removed){ R.status='paste'; R.err='금액이 있는 내역을 찾지 못했어요. 결제내역 화면의 글자를 그대로 붙여넣어 주세요.'; }
  drawCapture();
}

let R=null;
function buildReview(raw){
  const today=ymd(new Date()), seen=new Set(), outKeys=catsOf('out').map(c=>c[0]), inKeys=catsOf('in').map(c=>c[0]);
  for(const x of raw){
    const amount=Math.round(Math.abs(+String(x.amount).replace(/[^\d.-]/g,'')));
    if(!(amount>0)) continue;
    const kind=x.kind||'pay';
    const type = kind==='cancel' ? 'in' : (x.type==='in'?'in':'out');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date||'') ? x.date : today;
    const merchant=String(x.merchant||'').trim().slice(0,40);
    const key=[date,amount,type,norm(merchant)].join('|');
    if(seen.has(key)){ R.removed++; continue; }   // 캡처끼리 겹친 내역
    seen.add(key);
    const same=S.txs.filter(t=>!t.ex&&t.date===date&&t.amount===amount&&t.type===type);
    if(same.some(t=>sameText(t.memo,merchant))){ R.removed++; continue; }   // 이미 가계부에 있는 내역
    let cat = kind==='cancel' ? 'refund' : (catFromHistory(merchant,type) || x.category);
    if(!(type==='in'?inKeys:outKeys).includes(cat)) cat = type==='in'?'etc_in':'etc';
    const it={date,amount,type,merchant,cat,on:true,flag:'',who:R.who};
    if(kind==='card_bill'){ it.on=false; it.flag='카드대금이라 지출에서 뺐어요 (카드 결제 때 이미 기록돼요)'; }
    else if(kind==='transfer'){ it.on=false; it.flag='이체라서 뺐어요. 실제 지출이면 체크하세요'; }
    else if(same.length){ it.on=false; it.flag='같은 날 같은 금액 내역이 이미 있어요'; }
    else if(kind==='cancel'){ it.flag='승인취소라 환급으로 넣어요'; }
    R.items.push(it);
  }
  R.items.sort((a,b)=>b.date.localeCompare(a.date));
}
async function startCapture(files, who){
  R={status:'reading', done:0, total:files.length, who:who||S.lastWho||'us', items:[], removed:0, err:'', files, note:''};
  $('#sheet').hidden=false; document.body.style.overflow='hidden'; drawCapture();
  const raw=[]; const errs=[];
  const t0=Date.now(), me=R; const tick=setInterval(()=>{ if(R!==me||R.status!=='reading') return clearInterval(tick); R.sec=Math.round((Date.now()-t0)/1000); drawCapture(); },1000);
  const queue=[...files];
  const worker=async()=>{ while(queue.length && R===me){ const f=queue.shift();
    try{ const res=await readImage(await shrink(f), capturePrompt(), t=>{ if(R===me){ R.note=t; } }); (res&&Array.isArray(res.items)?res.items:[]).forEach(x=>raw.push(x)); }
    catch(e){ errs.push(e&&e.code||'api'); me.detail=e&&e.detail||String(e&&e.message||''); }
    me.done++; if(R===me) drawCapture(); } };
  await Promise.all([worker(), worker()]);
  clearInterval(tick); if(R!==me) return;
  buildReview(raw);
  R.status='review';
  if(!R.items.length) R.err = errs.length===files.length ? (READ_MSGS[errs[0]]||READ_MSGS.api)+(R.detail?` (${R.detail})`:'') : R.removed ? '' : '캡처에서 거래 내역을 찾지 못했어요. 금액과 가게 이름이 보이게 다시 캡처해 주세요.';
  else if(errs.length) R.err=`${errs.length}장은 읽지 못했어요. ${READ_MSGS[errs[0]]||''}`;
  drawCapture();
}

    <div class="sheet-top"><span></span><div class="cap-h">${R.mode==='paste'?'텍스트 붙여넣기':'결제내역 캡처'}</div><button class="iconbtn" data-act="cap-close" aria-label="닫기">${svg('close')}</button></div>${body}</div>
    ${R.status==='paste'?`<div class="save-bar"><div class="save-bar-in"><button class="btn primary" data-act="cap-read">내역 읽기</button></div></div>`:''}
    ${R.status==='review'?`<div class="save-bar"><div class="save-bar-in">${R.items.length?`<button class="btn primary" data-act="cap-save" ${n?'':'disabled'}>${n?`확인 완료 · ${n}건 등록 (${sumTxt()})`:'등록할 내역을 체크해 주세요'}</button>`:(R.err&&R.files?`<button class="btn" data-act="cap-close" style="flex:0 0 auto">닫기</button><button class="btn primary" data-act="cap-retry">다시 시도</button>`:`<button class="btn" data-act="cap-close">닫기</button>`)}</div></div>`:''}`;
  document.querySelectorAll('[data-cf]').forEach(el=>el.onchange=e=>{ const it=R.items[+el.dataset.i], f=el.dataset.cf;
    if(f==='amount'){ const v=+el.value.replace(/\D/g,''); it.amount=v; el.value=v?won(v):''; drawSaveBar(); }
    else { it[f]=el.value; if(f==='date') drawCapture(); } });
}
function sumTxt(){ let o=0,i=0; R.items.forEach(x=>{ if(x.on) x.type==='in'?i+=x.amount:o+=x.amount; }); return [o?`−${won(o)}원`:'', i?`+${won(i)}원`:''].filter(Boolean).join(' / ')||'0원'; }
function drawSaveBar(){ const btn=document.querySelector('[data-act="cap-save"]'); if(btn){ const n=R.items.filter(i=>i.on).length; btn.textContent=n?`확인 완료 · ${n}건 등록 (${sumTxt()})`:'등록할 내역을 체크해 주세요'; btn.disabled=!n; } }
function closeCapture(){ R=null; $('#sheet').hidden=true; document.body.style.overflow=''; }
async function saveCapture(){
  const base=Date.now(), txs=R.items.filter(i=>i.on&&i.amount>0).map((it,k)=>({id:uid(), type:it.type, date:it.date, amount:it.amount, who:it.who||R.who, cat:it.cat, memo:it.merchant, createdAt:base-k, cap:true}));
  if(!txs.length) return;
  try{ await store().putMany(txs); S.lastWho=R.who; S.month=txs[0].date.slice(0,7); S.selDay=txs[0].date; S.tab='book'; S.bookMode='cal'; closeCapture(); render(); toast(`${txs.length}건을 등록했어요`); }
  catch(e){ R.err='저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; drawCapture(); }
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.tab){ S.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(R && d.ci!==undefined){ const it=R.items[+d.ci]; it.on=!it.on; drawCapture(); return; }
  if(R && d.cwho){ R.who=d.cwho; R.items.forEach(x=>x.who=d.cwho); drawCapture(); return; }
  if(R && d.iwho){ R.items[+d.i].who=d.iwho; drawCapture(); return; }
  if(R && d.ctype){ const it=R.items[+d.i]; if(it.type!==d.ctype){ it.type=d.ctype; it.cat=d.ctype==='in'?'etc_in':'etc'; } drawCapture(); return; }
  if(d.themeSet){ try{ localStorage.setItem(THEME_LS,d.themeSet); }catch(e){} applyTheme(); render(); return; }
  if(d.delphoto){ if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='지우기'; } else { await store().removePhoto(d.delphoto); toast('사진을 지웠어요'); } return; }
  if(d.edit){ const t=S.txs.find(x=>x.id===d.edit); if(t) openSheet(t); return; }
  if(F && !$('#sheet').hidden){
    if(d.type){ if(F.type!==d.type){ F.type=d.type; F.cat=''; } drawSheet(); return; }
    if(d.who){ F.who=d.who; document.querySelectorAll('.pchip').forEach(x=>x.classList.toggle('on',x.dataset.who===d.who)); return; }
    if(d.cat){ F.cat=d.cat; document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.cat===d.cat)); $('#f-err').textContent=''; drawSugg(); return; }
    if(d.plus!==undefined){ F.amount= +d.plus ? F.amount + +d.plus : 0; $('#f-amt').value=F.amount?won(F.amount):''; return; }
    if(d.sugg){ F.memo=d.sugg; $('#f-memo').value=d.sugg;
      if(!F.cat){ const prev=S.txs.find(t=>t.memo===d.sugg&&t.type===F.type); if(prev){ F.cat=prev.cat; document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.cat===F.cat)); } }
      drawSugg(); return; }
  }
  switch(d.act){
    case 'add': openSheet(); break;
    case 'scan': $('#f-photo')?.click(); break;
    case 'photo-add': $('#ph-in')?.click(); break;
    case 'photo-next': { const sl=$('#slides'); if(sl){ const n=S.photos.length, i=(S.photoIdx+1)%n; sl.scrollTo({left:sl.clientWidth*i, behavior:'smooth'}); } } break;
    case 'photo-del': {
      const cur=S.photos[S.photoIdx]; if(!cur) break;
      if(!S.delArmed){ S.delArmed=true; b.classList.add('armed'); toast('한 번 더 누르면 이 사진을 지워요'); clearTimeout(S._delT); S._delT=setTimeout(()=>{ S.delArmed=false; document.querySelector('[data-act="photo-del"]')?.classList.remove('armed'); },3000); }
      else { S.delArmed=false; await store().removePhoto(cur.id); S.photoIdx=Math.max(0,S.photoIdx-1); toast('사진을 지웠어요'); render(); }
    } break;
    case 'bookmode': S.bookMode = S.bookMode==='cal'?'list':'cal'; render(); break;
    case 'caps': $('#f-caps')?.click(); break;
    case 'cap-close': closeCapture(); break;
    case 'cap-save': saveCapture(); break;
    case 'cap-read': readPasted(); break;
    case 'gem-test': geminiTest(); break;
    case 'save-orkey': { const v=$('#orkey').value.trim(); try{ v?localStorage.setItem(OR_LS,v):localStorage.removeItem(OR_LS); toast(v?'키를 저장했어요':'키를 지웠어요'); }catch(e){ toast('저장할 수 없어요'); } } break;
    case 'or-test': orTest(); break;
    case 'paste': { const who=F.who; closeSheet(); openPaste(who); } break;
    case 'cap-retry': { const fs=R.files, w=R.who; startCapture(fs,w); } break;
    case 'close': closeSheet(); break;
    case 'save': saveTx(); break;
    case 'del': if(!F.armed){ F.armed=true; drawSheet(); } else { try{ await store().remove(F.id); closeSheet(); toast('삭제했어요'); }catch(e){ $('#f-err').textContent='삭제하지 못했어요. 다시 시도해 주세요.'; } } break;
    case undefined: if(d.day){ S.selDay=d.day; render(); } break;
    case 'prev': S.month=shiftMonth(S.month,-1); render(); break;
    case 'next': S.month=shiftMonth(S.month,1); render(); break;
    case 'clear-ex': await store().removeMany(S.txs.filter(t=>t.ex).map(t=>t.id)); toast('예시를 지웠어요'); break;
    case 'logout': await FireStore.logout(); break;
    case 'csv': case 'csv-copy': exportCsv(d.act==='csv-copy'); break;
    case 'reset': if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='한 번 더 누르면 모두 지워요'; } else { S.txs=[]; LocalStore.persist(); render(); toast('모두 지웠어요'); } break;
  }
});

function bindSettings(){
  const bud=$('#budget'); bud.oninput=e=>{ const n=+e.target.value.replace(/\D/g,''); e.target.value=n?won(n):''; };
  document.querySelector('[data-act="save-settings"]').onclick=async ()=>{
    const s={...S.settings, names:{a:$('#nm-a').value.trim()||'나', b:$('#nm-b').value.trim()||'배우자'}, budget:+bud.value.replace(/\D/g,''), anniv:$('#anniv').value};
    try{ await store().saveSettings(s); toast('설정을 저장했어요'); }catch(e){ toast('저장하지 못했어요'); }
  };
  document.querySelector('[data-act="save-key"]').onclick=()=>{ const v=$('#gkey').value.trim(); try{ v?localStorage.setItem(GEMINI_LS,v):localStorage.removeItem(GEMINI_LS); toast(v?'키를 저장했어요':'키를 지웠어요'); }catch(e){ toast('이 브라우저에서는 저장할 수 없어요'); } };
  document.querySelector('[data-act="addcat"]').onclick=async ()=>{
    const label=$('#newcat').value.trim(); if(!label) return;
    const s={...S.settings, customCats:[...(S.settings.customCats||[]), {key:'c_'+uid(), label, type:'out'}]};
    await store().saveSettings(s); toast(`'${label}' 카테고리를 추가했어요`);
  };
  document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=async ()=>{
    const s={...S.settings, customCats:S.settings.customCats.filter(c=>c.key!==b.dataset.delcat)}; await store().saveSettings(s);
  });
}

function exportCsv(copy){
  const rows=[['날짜','구분','카테고리','사람','금액','메모']].concat(
    [...S.txs].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'입금':'지출',catInfo(t.cat).label,whoName(t.who),t.amount,t.memo||'']));
  const csv=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  if(copy){ navigator.clipboard?.writeText(csv).then(()=>toast('내역을 복사했어요'),()=>toast('복사하지 못했어요')); return; }
  const fname=`가계부_${ymd(new Date())}.csv`;
  if(!window.STANDALONE && window.claude){ window.claude.use('downloads').then(dl=>{ if(!dl) return toast('미리보기에서는 내역 복사를 이용해 주세요'); dl.save({filename:fname, data:'\ufeff'+csv}).then(()=>toast('CSV 파일을 저장했어요'),()=>{}); }); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV 파일을 만들었어요');
}

/* ---------------- 시작 ---------------- */
if(S.source==='firebase'){ FireStore.init(); } else { LocalStore.load(); }
render();
if(window.STANDALONE && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 가계부</title>
<meta name="theme-color" content="#F7F9F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.STANDALONE = true;</script>
<script src="config.js"></script>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 폰 앱 — 상단 월 이동, 요약 카드 1개, 날짜별 내역, 하단 탭 + 떠 있는 추가 버튼 */
:root{
  --bg:#F7F9F9; --surface:#FFFFFF; --chip:#EEF2F2; --line:#E2E8E7;
  --fg:#1D2626; --muted:#778584; --accent:#0E8A84; --accent-soft:#DFF2EF; --on-accent:#FFFFFF;
  --warn:#C9781F; --over:#C94C43; --sat:#3D6FC4;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1515; --surface:#172020; --chip:#212C2C; --line:#2A3635;
  --fg:#E6EEED; --muted:#8C9B9A; --accent:#3DC0B5; --accent-soft:#163734; --on-accent:#06201E;
  --warn:#E5A052; --over:#EA766C; --sat:#7FA6E8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1515; --surface:#172020; --chip:#212C2C; --line:#2A3635;
  --fg:#E6EEED; --muted:#8C9B9A; --accent:#3DC0B5; --accent-soft:#163734; --on-accent:#06201E;
  --warn:#E5A052; --over:#EA766C; --sat:#7FA6E8; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:14px 10px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding-inline:max(16px, env(safe-area-inset-left,0px))}
.month{display:flex;align-items:center;gap:6px}
.month h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;min-width:118px;text-align:center}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.iconbtn:active{background:var(--chip)}
.src{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--accent)}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px}
.sum-label{font-size:13px;color:var(--muted)}
.sum-big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sum-big small{font-size:16px;font-weight:600;margin-left:2px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.over>i{background:var(--over)}
.sum-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.sum-row div{display:grid;gap:2px;min-width:0}
.sum-row b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--accent)} .neg{color:var(--over)}
.hint{font-size:13px;color:var(--muted)}

.example{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.example button{font-weight:600;color:var(--accent);white-space:nowrap}

/* list */
.day{margin-top:22px}
.day-h{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 6px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--chip)}
.ic{width:42px;height:42px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--fg)}
.ic.in{background:var(--accent-soft);color:var(--accent)}
.item-t{flex:1;min-width:0}
.item-t b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-weight:500;overflow:hidden;word-break:break-all;line-height:1.4}
.item-t span{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.who{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-right:4px}
.empty{margin-top:40px;text-align:center;color:var(--muted);display:grid;gap:6px;justify-items:center}

/* analysis */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px 8px;margin-top:12px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow span{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 8px}
.cal-dow span:first-child,.cell.sun .d{color:var(--over)}
.cal-dow span:last-child,.cell.sat .d{color:var(--sat)}
.cell{display:grid;align-content:start;justify-items:center;gap:1px;min-height:62px;padding:5px 1px;border-radius:12px;min-width:0}
.cell .d{font-size:14px;font-weight:500;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .d{background:var(--chip);font-weight:700}
.cell.sel{background:var(--accent-soft)}
.cell.sel .d{background:var(--accent);color:var(--on-accent)}
.cell small{font-size:10.5px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
.cell .o{color:var(--fg)} .cell .p{color:var(--accent)}
.cell.blank{visibility:hidden}
.cal-sum{display:flex;justify-content:space-between;gap:8px;padding:10px 4px 0;font-size:13px;color:var(--muted)}
.sec-h{margin:26px 4px 10px;font-size:15px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.crow{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:10px 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow .bar{height:6px;margin-top:6px}
.crow-t{min-width:0;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.crow-t span{color:var(--muted);font-size:12.5px}
.delta{font-size:12px;text-align:right;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.split div,.split button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px;min-width:0;text-align:left}
.split button.on{border-color:var(--accent);background:var(--accent-soft)}
button.crow{width:100%;text-align:left;border-radius:10px}
button.crow.on{background:var(--accent-soft);margin-inline:-8px;padding-inline:8px;width:calc(100% + 16px)}

/* settings */
.field{display:grid;gap:6px;padding:14px 0}
.field+.field{border-top:1px solid var(--line)}
.field label{font-size:13px;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px}
.inp:focus{outline:none;border-color:var(--accent)}
input[type="date"],input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;width:100%;box-sizing:border-box;display:block;min-height:44px}
input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0}
.two>*{min-width:0}
.inp:disabled{opacity:.45}
input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type="date"]::-webkit-calendar-picker-indicator{margin:0}
.field{min-width:0}
.card{overflow:hidden}
.row input[type="date"]{min-height:0;display:block;width:100%}
.crec input[type="date"]{min-height:0;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--over)}
.btn.danger.armed{background:var(--over);color:var(--on-accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0}
.small{font-size:12.5px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;position:relative}
.tab{display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
.tab.on{color:var(--accent)}
.fab{display:none;position:absolute;right:4px;top:-76px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,138,132,.32)}
.fab svg.i{width:28px;height:28px;stroke-width:2}

/* sheet (입력 화면) */
.sheet{position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) calc(100px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-block:6px}
.seg{display:flex;justify-content:center;gap:18px;font-size:19px;font-weight:600}
.seg button{color:var(--muted);padding:4px 2px;border-bottom:2px solid transparent}
.seg button.on{color:var(--accent);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row .i{color:var(--muted)}
.row input{flex:1;min-width:0;border:0;background:none;font-size:17px;padding:4px 0}
.row textarea.grow{min-height:1.6em;flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;line-height:1.45;padding:2px 0;resize:none;overflow:hidden;color:var(--fg);word-break:break-all}
.row textarea.grow:focus{outline:none}
.row>svg.i{flex:none;margin-top:2px}
.row input:focus{outline:none}
.amount-in{font-size:26px!important;font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 4px 0}
.quick button{font-size:13px;padding:6px 10px;border-radius:99px;background:var(--chip)}
.people{display:flex;gap:8px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pchip{padding:8px 16px;border-radius:99px;background:var(--chip);font-weight:500}
.pchip.on{background:var(--accent);color:var(--on-accent)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 4px 0}
.sugg button{font-size:13px;padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px;padding:22px 0 8px}
.cat{display:grid;justify-items:center;gap:7px;font-size:13px}
.cat .ic{width:58px;height:58px}
.cat .ic svg.i{width:27px;height:27px}
.cat.on .ic{background:var(--accent);color:var(--on-accent)}
.cat.on{color:var(--accent);font-weight:600}
.save-bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.save-bar-in{max-width:520px;margin:0 auto;display:flex;gap:8px}
.save-bar .btn{flex:1;padding:15px}
.save-bar .btn.danger{flex:0 0 auto}
.err{color:var(--over);font-size:13px;padding:8px 4px 0;min-height:1px}

.scan{display:flex;align-items:center;gap:12px;width:100%;margin:6px 0 4px;padding:14px;border-radius:14px;border:1.5px dashed var(--accent);color:var(--accent);background:var(--accent-soft);text-align:left}
.scan b{display:block;font-weight:600}
.scan span{font-size:12.5px;color:var(--muted)}
.scan[disabled]{opacity:.7;cursor:progress}
.scan-msg{font-size:13px;padding:6px 4px 0;color:var(--muted)}
.scan-msg.ok{color:var(--accent)} .scan-msg.bad{color:var(--over)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.lim-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:14px}
.lim-line b{font-size:16px}
.mweek{display:grid;gap:8px;margin-top:14px}
.mday{display:grid;grid-template-columns:52px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 12px;align-items:start}
.mday.today{border-color:var(--accent)}
.mday-h{display:grid;justify-items:center;gap:2px;padding-top:6px}
.mday-h b{font-size:16px} .mday-h span{font-size:12px;color:var(--muted)}
.mday.sun .mday-h b{color:var(--over)} .mday.sat .mday-h b{color:var(--sat)}
.mday.today .mday-h b{color:var(--accent)}
.mslots{display:grid;gap:6px;min-width:0}
.mslot{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:start;text-align:left;padding:8px 10px;border-radius:10px;background:var(--bg);width:100%}
.mslot.mempty{background:transparent;border:1px dashed var(--line)}
.mslot.edit{background:var(--bg)}
.mtag{font-size:12px;color:var(--accent);font-weight:600;padding-top:2px}
.mtext{display:grid;gap:2px;min-width:0;word-break:break-word}
.mi{color:var(--muted)}
.medit{display:grid;gap:6px;min-width:0}
.medit .inp{padding:9px 10px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:default}
.evp{background:var(--accent-soft);color:var(--accent)!important;border-radius:4px;padding:0 3px;font-weight:600}
.ic.evic{background:var(--accent-soft);color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg)!important;font-size:15px!important}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.day-h .linkbtn{font-size:13px}
.splitbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 4px 0}
.splits{display:grid;gap:8px;padding:12px 0 4px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center}
.srow .inp{padding:0 12px;height:46px;line-height:46px;display:block}
.srow input.inp{text-align:right}
.sauto{text-align:right;background:var(--chip);color:var(--muted)}
.sauto.neg{color:var(--over)}
.srow .iconbtn{width:36px;height:36px}
.srow-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px}
.sbar{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-width:0}
.sbar svg.i{color:var(--muted);width:20px;height:20px}
.sbar input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:11px 0;color:var(--fg)}
.sbar input:focus{outline:none}
.sbar input::-webkit-search-cancel-button{-webkit-appearance:none}
.sres{padding:4px 4px 0;font-size:14px;color:var(--muted)}
.sres b{color:var(--fg)}
.sdate{font-size:12px;color:var(--muted);width:34px;flex:none;text-align:center;margin-left:-4px}
.fxbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin:2px 0 6px;font-weight:600;color:var(--fg);background:var(--surface)}
.fxbtn svg.i{color:var(--accent)}
.fxbtn .small{margin-left:auto;font-weight:400}
select.inp{-webkit-appearance:none;appearance:none;background-image:none}
.scan2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scan2 .scan{flex-direction:column;align-items:center;text-align:center;padding:12px 6px;gap:6px;margin:6px 0 4px}
.scan2 .scan b{font-size:14px}
.scan2 .scan span span{font-size:11.5px}
.cap-h{font-size:18px;font-weight:700;text-align:center}
.cap-info{display:grid;justify-items:center;gap:10px;padding:48px 0;color:var(--muted);text-align:center}
.cap-sum{padding:10px 4px;font-size:14px;color:var(--muted)}
.cap-sum b{color:var(--fg)}
.cap-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:6px}
.crec{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px;align-items:start}
.crec+.crec{border-top:1px solid var(--line)}
.crec.off{opacity:.5}
.ck{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--on-accent);margin-top:4px}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck svg.i{width:16px;height:16px;stroke-width:2.4}
.crec-b{display:grid;gap:6px;min-width:0}
.crec-r{display:flex;gap:6px;align-items:center;min-width:0}
.crec input,.crec select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:15px;min-width:0;color:var(--fg)}
.crec .m{flex:1}
.crec .a{width:104px;text-align:right}
.crec .dt{width:140px}
.crec select{flex:1}
.segm{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.segm button{padding:6px 9px;font-size:13px;color:var(--muted);background:var(--bg)}
.segm button+button{border-left:1px solid var(--line)}
.segm button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.crec .dt{flex:1;width:auto}
.flag{font-size:12px;color:var(--warn)}
.top.center{justify-content:center;padding-block:16px 12px}
.top.center h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.01em}
.top-actions{display:flex;gap:2px}
.dband{margin-inline:calc(-1 * max(16px, env(safe-area-inset-left,0px)));padding:26px 16px 22px;text-align:center;background:var(--accent-soft);display:grid;gap:4px}
.dband .dday{font-size:34px;font-weight:700;color:var(--accent);padding:0;letter-spacing:-.01em}
.memo-new{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.memo-new textarea{resize:none;border:0;background:var(--bg);font-size:16px;line-height:1.5}
.memo-act{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:8px}
.memo-act .btn{padding:9px 16px}
.linkbtn{color:var(--accent);font-weight:600;font-size:12.5px}

      await load(base+'firebase-app-compat.js');

    }catch(e){ S.fbError='Firebase를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; S.ready=true; render(); return; }
    firebase.initializeApp(CFG.firebase);
    this.auth=firebase.auth(); this.db=firebase.firestore();
    this.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    this.auth.onAuthStateChanged(u=>{ S.user=u; S.ready=true; this.unsub.forEach(f=>f()); this.unsub=[]; if(u) this.listen(); render(); });
  },
  home(){ return this.db.collection('households').doc(CFG.householdId||'our-home'); },
  listen(){
    this.liveStart = shiftMonth(ym(new Date()), -2)+'-01'; this.live=[]; this.old={}; this.loading={};
    this.unsub.push(this.home().collection('tx').where('date','>=',this.liveStart).onSnapshot(snap=>{ this.live=snap.docs.map(d=>d.data()); this.merge(); render(); }, err=>{ S.fbError='데이터를 읽을 권한이 없어요. 보안 규칙에 두 사람 이메일을 넣었는지 확인해 주세요.'; render(); }));
    this.unsub.push(this.home().collection('meals').where('date','>=',shiftMonth(ym(new Date()),-2)+'-01').onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const v=d.data(); m[v.date]=v; }); S.meals={...S.meals, ...m}; if(S.tab==='meal' && !S.mealEdit) render(); }, ()=>{}));
    this.unsub.push(this.home().collection('events').onSnapshot(snap=>{ S.events=snap.docs.map(d=>d.data()); if(!EV) render(); }, ()=>{}));
    this.unsub.push(this.home().collection('notes').onSnapshot(snap=>{ S.notes=snap.docs.map(d=>d.data()); if(!S.editNote) render(); }, ()=>{}));
    this.unsub.push(this.home().onSnapshot(d=>{ const data=d.exists?d.data():{}; const s=data.settings; if(s) S.settings={...structuredClone(DEFAULT_SETTINGS),...s}; S.keys=data.keys||{}; render(); }, ()=>{}));
  },
  merge(){ const m=new Map(); [...Object.values(this.old).flat(), ...this.live].forEach(t=>m.set(t.id,t)); S.txs=[...m.values()]; },
  ensureMonth(mo){   // 최근 3개월보다 예전 달은 볼 때만 불러와서 읽기 횟수를 아껴요
    if(!this.db || !S.user || !mo || mo+'-01' >= this.liveStart || this.old[mo] || this.loading[mo]) return;
    this.loading[mo]=true;
    this.home().collection('tx').where('date','>=',mo+'-01').where('date','<=',mo+'-31').get()
      .then(snap=>{ this.old[mo]=snap.docs.map(d=>d.data()); this.merge(); render(); })
      .catch(()=>{}).finally(()=>{ this.loading[mo]=false; });
  },
  async loadAll(){ if(this.allLoaded||!this.db||!S.user) return; this.allLoaded=true;
    try{ const snap=await this.home().collection('tx').where('date','>=',searchFrom()).where('date','<',this.liveStart).get(); const by={}; snap.docs.forEach(d=>{ const t=d.data(); const m=String(t.date).slice(0,7); (by[m]=by[m]||[]).push(t); }); Object.assign(this.old, by); this.merge(); }
    catch(e){ this.allLoaded=false; throw e; } },
  dropOld(date){ const mo=String(date||'').slice(0,7); if(this.old[mo]){ delete this.old[mo]; this.ensureMonth(mo); } },
  async put(tx){ tx.by=S.user?.email||''; await this.home().collection('tx').doc(tx.id).set(tx); this.dropOld(tx.date); },
  async putMany(txs){ const b=this.db.batch(); txs.forEach(t=>{ t.by=S.user?.email||''; b.set(this.home().collection('tx').doc(t.id), t); }); await b.commit(); txs.forEach(t=>this.dropOld(t.date)); },
  async remove(id){ const t=S.txs.find(x=>x.id===id); await this.home().collection('tx').doc(id).delete(); if(t){ Object.keys(this.old).forEach(k=>{ this.old[k]=this.old[k].filter(x=>x.id!==id); }); this.merge(); render(); } },
  async removeMany(ids){ const b=this.db.batch(); ids.forEach(id=>b.delete(this.home().collection('tx').doc(id))); await b.commit(); },
  async saveSettings(s){ await this.home().set({settings:s},{merge:true}); },
  async saveKey(name,v){ await this.home().set({keys:{[name]:v}},{merge:true}); },
  async putNote(n){ await this.home().collection('notes').doc(n.id).set(n); },
  async putMeal(m){ await this.home().collection('meals').doc(m.date).set(m); },
  async putEvent(e){ await this.home().collection('events').doc(e.id).set(e); },
  async removeEvent(id){ await this.home().collection('events').doc(id).delete(); },
  async putMeals(ms){ const b=this.db.batch(); ms.forEach(m=>b.set(this.home().collection('meals').doc(m.date), m)); await b.commit(); },
  async removeNote(id){ await this.home().collection('notes').doc(id).delete(); },
  async login(email,pw){ await this.auth.signInWithEmailAndPassword(email,pw); },
  async logout(){ await this.auth.signOut(); }
};

function totals(m){ let out=0,inc=0; monthTx(m).forEach(t=>t.type==='in'?inc+=t.amount:out+=t.amount); return {out,inc}; }

const calAmt = n => n>=1000000 ? short(n) : won(n);
function calendarView(){

  }

  let weeks=''; for(let i=0;i<cells.length;i+=7) weeks+=`<div class="wk">${cells.slice(i,i+7).join('')}</div>`;
  const sel=monthTx(S.month).filter(t=>t.date===S.selDay).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const so=sel.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0), si=sel.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);

  html+=`<div class="day"><div class="day-h"><span>${sd.getMonth()+1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일 내역</span><span class="num">${si?`<span class="pos">+${won(si)}원</span> `:''}${so?'−'+won(so)+'원':''}</span></div>`;
  html+= sel.length ? `<div class="items">${sel.map(itemRow).join('')}</div>` : `<div class="empty" style="margin-top:14px"><div>이날은 기록이 없어요.</div><div class="small">아래 가계부 등록을 누르면 이 날짜로 입력돼요.</div></div>`;
  return html+'</div>';
}

  return diff>=0 ? `D+${diff}` : `D${diff}`;
}

  const up=upcoming(30).slice(0,4);

  html+=miniSummary();
  const recent=[...S.txs].filter(t=>!t.ex).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).slice(0,3);
  if(recent.length) html+=`<h2 class="sec-h">최근 내역</h2><div class="items">${recent.map(itemRow).join('')}</div>`;
  return html;

/* ---------------- 주간 식단 ---------------- */
const SLOT={b:'아침', l:'점심', d:'저녁'};
const FOOD_CATS=['food','delivery','conv','alcohol'];
function weekFood(from){ const e=new Date(from+'T00:00'); e.setDate(e.getDate()+6); const to=ymd(e);
  return S.txs.filter(t=>!t.ex&&t.type==='out'&&t.date>=from&&t.date<=to&&FOOD_CATS.includes(t.cat)).reduce((a,t)=>a+t.amount,0); }
// 주의 '달'은 그 주 월요일이 속한 달. 달이 바뀌면 초과분은 리셋돼요.
function weekLimit(from){
  const base=+S.settings.weeklyFood||0, month=from.slice(0,7);
  const d=new Date(month+'-01T00:00'); while(d.getDay()!==1) d.setDate(d.getDate()+1);

    debt=newDebt; d.setDate(d.getDate()+7); }
  return info||{adj:base, carried:0, debtOut:0, nextAdj:base, nextReset:false};
}
function weekStart(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }

function splitRemain(){ const used=F.split.slice(0,-1).reduce((a,r)=>a+(+r.amount||0),0); return (F.amount||0)-used; }
function updateSplit(){ const el=$('#s-last'); if(!el) return; const r=splitRemain(); el.textContent=won(r); el.classList.toggle('neg', r<=0); }
function bindSplit(){
  document.querySelectorAll('[data-samt]').forEach(el=>el.oninput=e=>{ const v=+e.target.value.replace(/\D/g,'').slice(0,12); F.split[+el.dataset.samt].amount=v; e.target.value=v?won(v):''; updateSplit(); });
  document.querySelectorAll('[data-scat]').forEach(el=>el.onchange=()=>{ F.split[+el.dataset.scat].cat=el.value; });
  updateSplit();
}
function startSplit(){ const a=F.cat&&F.cat!=='mart'?F.cat:'food'; F.split=[{cat:a, amount:0},{cat:a==='mart'?'food':'mart', amount:0}]; }
function setSplitFrom(parts){   // [{cat, amount}] → F.split (마지막은 자동 계산)
  F.split=parts.map(p=>({cat:p.cat, amount:p.amount}));
}

function autoGrow(el){ if(!el) return; el.style.height='auto'; const h=el.scrollHeight; if(h>0) el.style.height=h+'px'; else el.style.height=''; }
function drawSugg(){
  const box=$('#sugg'); if(!box) return;

}
async function saveTx(){
  if(F.busy) return;
  const err=$('#f-err');
  if(!F.amount){ err.textContent='금액을 입력해 주세요.'; return; }
  if(!F.cat && !F.split){ err.textContent='카테고리를 골라 주세요.'; return; }
  if(!F.date){ err.textContent='날짜를 골라 주세요.'; return; }
  if(F.split && F.type==='out'){
    const rem=splitRemain(); if(F.split.slice(0,-1).some(r=>!(+r.amount>0))){ err.textContent='나눈 금액을 모두 입력해 주세요.'; return; }
    if(rem<=0){ err.textContent='나눈 금액의 합이 총액보다 커요. 금액을 확인해 주세요.'; return; }
    const group=F.group||uid(), base=F.createdAt||Date.now(), memo=(F.memo||'').trim();
    const txs=F.split.map((r,i)=>({id: i===0?F.id:uid(), type:'out', date:F.date, amount: i===F.split.length-1?rem:+r.amount, who:F.who, cat:r.cat, memo, createdAt:base-i, group}));
    // 같은 카테고리 칸은 합쳐요
    const merged=[]; txs.forEach(t=>{ const m=merged.find(x=>x.cat===t.cat); if(m) m.amount+=t.amount; else merged.push(t); });
    F.busy=true; S.lastWho=F.who; S.month=F.date.slice(0,7); if(S.tab==='book') S.selDay=F.date;
    if(merged.length===1) delete merged[0].group;
    try{ await store().putMany(merged); closeSheet(); toast(merged.length>1?`${merged.length}건으로 나눠 저장했어요`:'저장했어요'); }
    catch(e){ if(F) F.busy=false; err.textContent='저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; }
    return;
  }
  const tx={id:F.id,type:F.type,date:F.date,amount:F.amount,who:F.who,cat:F.cat,memo:(F.memo||'').trim(),createdAt:F.createdAt||Date.now()};
  if(F.group) tx.group=F.group;
  F.busy=true; S.lastWho=F.who; const wasEdit=F.isEdit; S.month=F.date.slice(0,7); if(S.tab==='book') S.selDay=F.date;
  try{ await store().put(tx); closeSheet(); toast(wasEdit?'수정했어요':'저장했어요'); }
  catch(e){ if(F) F.busy=false; err.textContent='저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; }
}

async function shrink(file){
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1200/Math.max(bmp.width,bmp.height));
    const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.8));
  }catch(e){ return file; }
}
const blobToB64 = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); });
function parseJson(t){ t=String(t||'').trim().replace(/^```(json)?/,'').replace(/```$/,''); const a=t.indexOf('{'), b=t.lastIndexOf('}'); return JSON.parse(t.slice(a,b+1)); }
const GEM_MODEL_LS='gagyebu.geminiModel', GEM_LIST_LS='gagyebu.geminiModels', GEM_BUSY_LS='gagyebu.geminiBusy';
function markBusy(m, ms=600000){ try{ const b=JSON.parse(localStorage.getItem(GEM_BUSY_LS)||'{}'); b[m]=Date.now()+ms-600000; localStorage.setItem(GEM_BUSY_LS, JSON.stringify(b)); }catch(e){} }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function tfetch(url, opts={}, ms=20000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(), ms);
  try{ return await fetch(url, {...opts, signal:c.signal}); } catch(e){ if(c.signal.aborted) throw {code:'timeout'}; throw e; } finally{ clearTimeout(t); } }
async function listGeminiModels(key){

  [/SKT|SK텔레콤|LG유플러스|U\+|알뜰폰|\bKT\b/,'telecom'],[/관리비|한국전력|한전|도시가스|수도/,'utility'],[/CGV|메가박스|롯데시네마|교보|예스24|알라딘|영풍/,'culture'],
  [/올리브영|미용실|헤어|네일/,'beauty'],[/무신사|지그재그|에이블리|29CM|유니클로|자라|ZARA|탑텐|스파오/i,'fashion'],
  [/호텔|항공|여기어때|야놀자|아고다|에어비앤비|트립닷컴/i,'travel'],[/보험|생명|화재|손해/,'insurance'],
  [/호프|포차|주점|이자카야|와인|맥주/,'alcohol'],
  [/식당|국밥|김밥|맥도날드|버거킹|롯데리아|맘스터치|서브웨이|분식|치킨|피자|족발|고기|식육|횟집|초밥|스시|라멘|국수|반점|짬뽕|한식|중식|일식|푸드|키친/,'food']];
function kwCat(t,type){ if(type==='in'){ if(/급여|월급|상여|SALARY/i.test(t)) return 'salary'; if(/이자|배당/.test(t)) return 'interest'; if(/환급|환불/.test(t)) return 'refund'; return 'etc_in'; }
  for(const [re,c] of KW) if(re.test(t)) return c; return 'etc'; }
function maskNumbers(t){
  return String(t||'')
    .replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{1,4}\b/g,'****-****')                // 카드번호
    .replace(/\b\d{2,6}[-*]{1,3}[\d*]{2,6}[-*]{1,3}[\d*]{2,8}(?:[-*][\d*]{1,6})?\b/g,'***-****')  // 계좌번호
    .replace(/(?<![\d,.])\d{10,16}(?![\d,])/g,'**********')                               // 붙어 있는 긴 숫자
    .replace(/(잔액|누적)[ \t]*[\d,]+[ \t]*원?/g,'$1 ***');
}
function parseText(raw){
  const now=new Date(), Y=now.getFullYear(), M=now.getMonth()+1;
  const mk=(y,m,d)=>{ if(!y) y = m>M ? Y-1 : Y; if(y<100) y+=2000; return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; };
  const dateOf=l=>{ let m;
    if((m=l.match(/(20\d{2}|\d{2})[.\-/년]\s*(\d{1,2})[.\-/월]\s*(\d{1,2})/))) return mk(+m[1],+m[2],+m[3]);
    if((m=l.match(/(\d{1,2})월\s*(\d{1,2})일/))) return mk(0,+m[1],+m[2]);
    if((m=l.match(/(?:^|\s|\[KB\])(\d{1,2})[./](\d{1,2})(?![\d,])/)) && +m[1]<=12 && +m[2]<=31) return mk(0,+m[1],+m[2]);
    if(/^오늘\b/.test(l)) return ymd(now);
    if(/^어제\b/.test(l)){ const d=new Date(now); d.setDate(d.getDate()-1); return ymd(d); }
    return ''; };
  const META=/잔액|누적|한도|포인트|적립|할인|일시불|할부|개월|승인|체크카드|신용카드|국민카드|KB국민|KB\s?Pay|Web발신|^\[|이용내역|거래내역|전체|조회|^\d{1,2}:\d{2}|^[\d*\-]{6,}$|\*/;
  const amtOf=l=>{ if(/잔액|누적|한도|포인트|적립/.test(l)) return null; const m=l.match(/^([+\-−]?)\s*([\d]{1,3}(?:,\d{3})+|\d+)\s*원?$/)||l.match(/([+\-−]?)\s*([\d]{1,3}(?:,\d{3})+|\d{3,})\s*원/); if(!m) return null;
    const v=+m[2].replace(/,/g,''); return v>0&&v<100000000 ? {v, sign:m[1]} : null; };
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let cur=ymd(now), seen=false; const out=[];
  const recs=[];  // [{i, amt, sign, date}]
  lines.forEach((l,i)=>{ const d=dateOf(l); if(d){ cur=d; seen=true; } const a=amtOf(l); if(a && !(d && !/원/.test(l))) recs.push({i, amt:a.v, sign:a.sign, date:cur, seen}); });
  recs.forEach((r,k)=>{
    const from=k?recs[k-1].i+1:0, to=k<recs.length-1?recs[k+1].i:lines.length;
    const isText=l=>!META.test(l) && !dateOf(l) && !amtOf(l) && /[가-힣A-Za-z]/.test(l) && !/^(입금|출금|지출|수입|결제|취소)$/.test(l) && l.length<=40;
    let merchant=''; for(let j=r.i-1;j>=from;j--){ if(isText(lines[j])){ merchant=lines[j]; break; } }
    if(!merchant && !r.seen) for(let j=r.i+1;j<to;j++){ if(isText(lines[j])){ merchant=lines[j]; break; } }
    const ctx=lines.slice(from, Math.min(to,r.i+2)).join(' ');
    let date=r.date; if(!r.seen){ for(let j=r.i+1;j<to;j++){ const d=dateOf(lines[j]); if(d){ date=d; break; } } }   // 문자처럼 날짜가 금액 뒤에 오는 경우
    const cancel=/취소/.test(ctx);
    const isIn = cancel || r.sign==='+' || r.sign==='-' || r.sign==='−' || (/입금|환불|받음|급여/.test(ctx) && !/출금|결제|승인/.test(ctx));
    let kind = (cancel||r.sign==='-'||r.sign==='−')?'cancel': (/카드대금|결제대금/.test(merchant+ctx) || (/카드/.test(ctx)&&/출금/.test(ctx)&&!/승인/.test(ctx)))?'card_bill':'pay';
    if(kind==='card_bill'&&!merchant) merchant='카드대금';
    const nm=[S.settings.names.a,S.settings.names.b].filter(Boolean);
    if(kind==='pay' && (/이체|송금/.test(ctx) || nm.some(n=>merchant.includes(n)))) kind='transfer';
    let cat=kwCat(merchant, isIn?'in':'out'); if(isIn && cat==='etc_in' && /\(주\)|주식회사|㈜/.test(merchant) && r.amt>=500000) cat='salary';
    out.push({date, merchant: merchant.replace(/\s*(결제|사용|승인)$/,''), amount:r.amt, type:isIn?'in':'out', kind, category:cat});
  });
  return out;
}
function openPaste(who){ R={status:'paste', mode:'paste', who:who||S.lastWho||'us', items:[], removed:0, err:'', text:''}; $('#sheet').hidden=false; document.body.style.overflow='hidden'; drawCapture(); setTimeout(()=>{ const ta=$('#cap-text'); if(ta){ ta.focus(); ta.addEventListener('paste',()=>setTimeout(()=>{ ta.value=maskNumbers(ta.value); },0)); } },50); }

let R=null;
function buildReview(raw){
  const today=ymd(new Date()), seen=new Set(), outKeys=catsOf('out').map(c=>c[0]), inKeys=catsOf('in').map(c=>c[0]);
  for(const x of raw){
    const amount=Math.round(Math.abs(+String(x.amount).replace(/[^\d.-]/g,'')));
    if(!(amount>0)) continue;
    const kind=x.kind||'pay';
    const type = kind==='cancel' ? 'in' : (x.type==='in'?'in':'out');
    const date = /^\d{4}-\d{2}-\d{2}$/.test(x.date||'') ? x.date : today;
    const merchant=String(x.merchant||'').trim().slice(0,40);
    const key=[date,amount,type,norm(merchant)].join('|');
    if(seen.has(key)){ R.removed++; continue; }   // 캡처끼리 겹친 내역
    seen.add(key);
    const same=S.txs.filter(t=>!t.ex&&t.date===date&&t.amount===amount&&t.type===type);
    if(same.some(t=>sameText(t.memo,merchant))){ R.removed++; continue; }   // 이미 가계부에 있는 내역
    let cat = kind==='cancel' ? 'refund' : (catFromHistory(merchant,type) || x.category);
    if(!(type==='in'?inKeys:outKeys).includes(cat)) cat = type==='in'?'etc_in':'etc';
    const it={date,amount,type,merchant,cat,on:true,flag:'',who:R.who};
    if(kind==='card_bill'){ it.on=false; it.flag='카드대금이라 지출에서 뺐어요 (카드 결제 때 이미 기록돼요)'; }
    else if(kind==='transfer'){ it.on=false; it.flag='이체라서 뺐어요. 실제 지출이면 체크하세요'; }
    else if(same.length){ it.on=false; it.flag='같은 날 같은 금액 내역이 이미 있어요'; }
    else if(kind==='cancel'){ it.flag='승인취소라 환급으로 넣어요'; }
    R.items.push(it);
  }
  R.items.sort((a,b)=>b.date.localeCompare(a.date));
}
async function startCapture(files, who){
  R={status:'reading', done:0, total:files.length, who:who||S.lastWho||'us', items:[], removed:0, err:'', files, note:''};
  $('#sheet').hidden=false; document.body.style.overflow='hidden'; drawCapture();
  const raw=[]; const errs=[];
  const t0=Date.now(), me=R; const tick=setInterval(()=>{ if(R!==me||R.status!=='reading') return clearInterval(tick); R.sec=Math.round((Date.now()-t0)/1000); drawCapture(); },1000);
  const queue=[...files];
  const worker=async()=>{ while(queue.length && R===me){ const f=queue.shift();
    try{ const res=await readImage(await shrink(f), capturePrompt(), t=>{ if(R===me){ R.note=t; } }); (res&&Array.isArray(res.items)?res.items:[]).forEach(x=>raw.push(x)); }
    catch(e){ errs.push(e&&e.code||'api'); me.detail=e&&e.detail||String(e&&e.message||''); }
    me.done++; if(R===me) drawCapture(); } };
  await Promise.all([worker(), worker()]);
  clearInterval(tick); if(R!==me) return;
  buildReview(raw);
  R.status='review';
  if(!R.items.length) R.err = errs.length===files.length ? (READ_MSGS[errs[0]]||READ_MSGS.api)+(R.detail?` (${R.detail})`:'') : R.removed ? '' : '캡처에서 거래 내역을 찾지 못했어요. 금액과 가게 이름이 보이게 다시 캡처해 주세요.';
  else if(errs.length) R.err=`${errs.length}장은 읽지 못했어요. ${READ_MSGS[errs[0]]||''}`;
  drawCapture();
}

function fxDate(f, month){ const [y,m]=month.split('-').map(Number), last=new Date(y,m,0).getDate(); const d=Math.min(Math.max(1,+f.day||1), last); return `${month}-${String(d).padStart(2,'0')}`; }

  let body='';
  if(FX.edit){ const f=FX.edit;
    body=`<div class="card" style="margin-top:8px"><div class="field"><label for="fx-name">이름</label><input class="inp" id="fx-name" value="${esc(f.name||'')}" placeholder="예: 월세, 보험료, 넷플릭스"></div>
      <div class="field"><label for="fx-amt">금액 (원)</label><input class="inp num" id="fx-amt" inputmode="numeric" value="${f.amount?won(f.amount):''}" placeholder="0"></div>
      <div class="field"><label for="fx-day">매달 며칠</label><input class="inp num" id="fx-day" inputmode="numeric" value="${esc(f.day||'')}" placeholder="예: 25"></div>
      <div class="field"><label for="fx-cat">카테고리</label><select class="inp" id="fx-cat">${catsOf('out').map(([k,l])=>`<option value="${k}" ${k===(f.cat||'housing')?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label>누가</label><span class="segm" style="align-self:start">${[['a',names.a],['b',names.b],['us','우리']].map(([k,l])=>`<button class="${(f.who||'us')===k?'on':''}" data-fxwho="${k}">${esc(l)}</button>`).join('')}</span></div>
      ${f.id&&list.some(x=>x.id===f.id)?`<div class="btns"><button class="btn danger ${FX.armed?'armed':''}" data-act="fx-del">${FX.armed?'한 번 더 누르면 삭제':'이 고정지출 삭제'}</button></div>`:''}
      <div class="err" id="fx-err"></div></div>`;
  } else if(!list.length){
    body=`<div class="empty" style="margin-top:30px"><div>저장된 고정지출이 없어요.</div><div class="small">월세·보험료·통신비·구독료처럼 매달 나가는 돈을 등록해 두면<br>한 번에 불러올 수 있어요.</div></div>`;
  } else {
    body=`<div class="cap-sum">${monthLabel(FX.month)}에 넣을 고정지출을 골라 주세요</div><div class="cap-list">${list.map(f=>{ const done=fxRegistered(f,FX.month), on=!!FX.sel[f.id], c=catInfo(f.cat);
      return `<div class="crec ${on&&!done?'':'off'}"><button class="ck ${on&&!done?'on':''}" ${done?'disabled':`data-fxsel="${esc(f.id)}"`} aria-label="${done?'이미 등록됨':on?'빼기':'넣기'}">${on&&!done?svg('check'):''}</button>
        <div class="crec-b" data-fxedit="${esc(f.id)}" style="cursor:pointer"><div class="crec-r" style="justify-content:space-between"><b style="font-weight:600">${esc(f.name)}</b><b class="num">${won(f.amount)}원</b></div>
        <div class="small">매달 ${esc(f.day||1)}일 · ${esc(c.label)} · ${esc(whoName(f.who||'us'))}</div>${done?'<div class="flag" style="color:var(--accent)">이번 달 이미 등록됨</div>':''}</div></div>`; }).join('')}</div>
      <div class="small" style="padding:10px 4px 0">항목을 누르면 고칠 수 있어요.</div>`;
  }
  $('#sheet').innerHTML=`<div class="sheet-in"><div class="sheet-top">${FX.edit?`<button class="iconbtn" data-act="fx-back" aria-label="뒤로">${svg('back')}</button>`:'<span></span>'}<div class="cap-h">${FX.edit?(FX.edit.id&&list.some(x=>x.id===FX.edit.id)?'고정지출 고치기':'새 고정지출'):'고정지출 불러오기'}</div><button class="iconbtn" data-act="fx-close" aria-label="닫기">${svg('close')}</button></div>${body}</div>
    <div class="save-bar"><div class="save-bar-in">${FX.edit?`<button class="btn primary" data-act="fx-save">저장</button>`
      :`<button class="btn" data-act="fx-new" style="flex:0 0 auto">+ 추가</button>${list.length?`<button class="btn primary" data-act="fx-load" ${n&&!FX.busy?'':'disabled'}>${FX.busy?'넣는 중…':n?`${n}건 넣기 (−${won(total)}원)`:list.every(f=>fxRegistered(f,FX.month))?'이번 달 모두 등록됨':'넣을 항목을 골라 주세요'}</button>`:''}`}</div></div>`;
  const amt=$('#fx-amt'); if(amt) amt.oninput=e=>{ const v=+e.target.value.replace(/\D/g,'').slice(0,12); e.target.value=v?won(v):''; };
  const nm=$('#fx-name'), cs=$('#fx-cat'); if(nm&&cs){ let touched=!!FX.edit.id; cs.onchange=()=>{ touched=true; };
    nm.oninput=()=>{ if(touched) return; const t=nm.value; const c=/월세|관리비|전세|주거/.test(t)?'housing':/보험/.test(t)?'insurance':/대출|이자/.test(t)?'loan':kwCat(t,'out'); if(c&&c!=='etc') cs.value=c; }; }
}
async function saveFixed(){
  const f=FX.edit, name=$('#fx-name').value.trim(), amount=+$('#fx-amt').value.replace(/\D/g,''), day=Math.min(31,Math.max(1,+$('#fx-day').value.replace(/\D/g,'')||1));
  if(!name||!amount){ $('#fx-err').textContent='이름과 금액을 넣어 주세요.'; return; }
  const item={id:f.id||uid(), name:name.slice(0,30), amount, day, cat:$('#fx-cat').value, who:f.who||'us'};
  const list=[...(S.settings.fixed||[])]; const i=list.findIndex(x=>x.id===item.id); if(i>=0) list[i]=item; else list.push(item);
  try{ await store().saveSettings({...S.settings, fixed:list}); S.settings.fixed=list; FX.sel[item.id]=!fxRegistered(item,FX.month); FX.edit=null; FX.armed=false; drawFixed(); toast('고정지출을 저장했어요'); }
  catch(e){ $('#fx-err').textContent='저장하지 못했어요. 인터넷 연결을 확인해 주세요.'; }
}
async function loadFixed(){
  if(FX.busy) return; const base=Date.now(), txs=(S.settings.fixed||[]).filter(f=>FX.sel[f.id] && !fxRegistered(f,FX.month)).map((f,k)=>({id:`fx_${f.id}_${FX.month}`, type:'out', date:fxDate(f,FX.month), amount:f.amount, who:f.who||'us', cat:f.cat||'etc', memo:f.name, createdAt:base-k, fx:f.id}));
  if(!txs.length){ toast('이번 달에 이미 모두 등록돼 있어요'); return; }
  FX.busy=true; drawFixed();
  try{ await store().putMany(txs); FX=null; $('#sheet').hidden=true; document.body.style.overflow=''; S.tab='book'; S.bookMode='list'; render(); toast(`고정지출 ${txs.length}건을 넣었어요`); }
  catch(e){ if(FX){ FX.busy=false; drawFixed(); } toast('넣지 못했어요. 다시 시도해 주세요', 3000); }
}
function closeCapture(){ R=null; $('#sheet').hidden=true; document.body.style.overflow=''; }
async function saveCapture(){
  if(R.busy) return; R.busy=true;
  const base=Date.now(), txs=R.items.filter(i=>i.on&&i.amount>0).map((it,k)=>({id:uid(), type:it.type, date:it.date, amount:it.amount, who:it.who||R.who, cat:it.cat, memo:it.merchant, createdAt:base-k, cap:true}));
  if(!txs.length){ R.busy=false; return; }
  const sb=document.querySelector('[data-act="cap-save"]'); if(sb){ sb.disabled=true; sb.textContent='등록하는 중…'; }
  try{ await store().putMany(txs); S.lastWho=R.who; S.month=txs[0].date.slice(0,7); S.selDay=txs[0].date; S.tab='book'; S.bookMode='cal'; closeCapture(); render(); toast(`${txs.length}건을 등록했어요`); }
  catch(e){ R.busy=false; R.err='저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'; drawCapture(); }
}

/* ---------------- 이벤트 ---------------- */
document.addEventListener('click', e=>{ const fe=e.target.closest('[data-fxedit]'); if(fe && FX && !e.target.closest('button')){ const f=(S.settings.fixed||[]).find(x=>x.id===fe.dataset.fxedit); if(f){ FX.edit={...f}; FX.armed=false; drawFixed(); } } });
document.addEventListener('click', e=>{ const ne=e.target.closest('[data-note-edit]'); if(ne && !e.target.closest('button')){ S.editNote=ne.dataset.noteEdit; render(); } });
document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.tab){ S.tab=d.tab; render(); window.scrollTo(0,0); return; }
  if(R && d.ci!==undefined){ const it=R.items[+d.ci]; it.on=!it.on; drawCapture(); return; }
  if(R && d.cwho){ R.who=d.cwho; R.items.forEach(x=>x.who=d.cwho); drawCapture(); return; }
  if(R && d.iwho){ R.items[+d.i].who=d.iwho; drawCapture(); return; }
  if(R && d.ctype){ const it=R.items[+d.i]; if(it.type!==d.ctype){ it.type=d.ctype; it.cat=d.ctype==='in'?'etc_in':'etc'; } drawCapture(); return; }
  if(d.themeSet){ try{ localStorage.setItem(THEME_LS,d.themeSet); }catch(e){} applyTheme(); render(); return; }
  if(d.me){ try{ localStorage.setItem(ME_LS, d.me); }catch(e){} render(); return; }
  if(d.noteDone){ const n=S.notes.find(x=>x.id===d.noteDone); if(n) patchNote(n.id,{done:!n.done}); return; }
  if(d.notePin){ const n=S.notes.find(x=>x.id===d.notePin); if(n){ patchNote(n.id,{pin:!n.pin}); toast(n.pin?'고정을 풀었어요':'맨 위에 고정했어요'); } return; }
  if(d.noteDel){ if(S.delNote!==d.noteDel){ S.delNote=d.noteDel; render(); clearTimeout(S._dn); S._dn=setTimeout(()=>{ S.delNote=null; render(); },3000); } else { S.delNote=null; try{ await store().removeNote(d.noteDel); toast('메모를 지웠어요'); }catch(e){ toast('지우지 못했어요'); } } return; }
  if(d.noteSave){ const v=$('#note-edit').value.trim(); S.editNote=null; if(v) await patchNote(d.noteSave,{text:v.slice(0,500)}); render(); return; }
  if(FX && d.fxsel){ FX.sel[d.fxsel]=!FX.sel[d.fxsel]; drawFixed(); return; }
  if(FX && d.fxwho){ FX.edit.who=d.fxwho; FX.edit.name=$('#fx-name').value; FX.edit.amount=+$('#fx-amt').value.replace(/\D/g,''); FX.edit.day=$('#fx-day').value; FX.edit.cat=$('#fx-cat').value; drawFixed(); return; }
  if(d.meal){ S.mealEdit=d.meal; render(); setTimeout(()=>$('#me-menu')?.focus(),30); return; }
  if(d.mesave){ const [key,k]=d.mesave.split('|'); saveMealSlot(key,k); return; }
  if(d.evedit){ const e=S.events.find(x=>x.id===d.evedit); if(e) openEvent(e); return; }
  if(EV && d.evwho){ readEvForm(); EV.who=d.evwho; drawEvent(); return; }
  if(d.statwho){ S.statWho = S.statWho===d.statwho ? '' : d.statwho; render(); if(S.statWho) setTimeout(()=>$('#stat-list')?.scrollIntoView({behavior:'smooth',block:'start'}),30); return; }
  if(d.statcat){ S.statCat = S.statCat===d.statcat ? '' : d.statcat; render(); if(S.statCat) setTimeout(()=>$('#stat-list')?.scrollIntoView({behavior:'smooth',block:'start'}),30); return; }
  if(F && d.sdel!==undefined){ F.split.splice(+d.sdel,1); drawSheet(); return; }
  if(d.q){ S.search=d.q; const q=$('#q'); if(q) q.value=d.q; drawSearch(); return; }
  if(d.edit){ const t=S.txs.find(x=>x.id===d.edit); if(t) openSheet(t); return; }
  if(F && !$('#sheet').hidden){
    if(d.type){ if(F.type!==d.type){ F.type=d.type; F.cat=''; } drawSheet(); return; }
    if(d.who){ F.who=d.who; document.querySelectorAll('.pchip').forEach(x=>x.classList.toggle('on',x.dataset.who===d.who)); return; }
    if(d.cat){ F.cat=d.cat; document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.cat===d.cat)); $('#f-err').textContent=''; drawSugg(); return; }
    if(d.plus!==undefined){ F.amount= +d.plus ? F.amount + +d.plus : 0; $('#f-amt').value=F.amount?won(F.amount):''; return; }
    if(d.sugg){ F.memo=d.sugg; $('#f-memo').value=d.sugg; autoGrow($('#f-memo'));
      if(!F.cat){ const prev=S.txs.find(t=>t.memo===d.sugg&&t.type===F.type); if(prev){ F.cat=prev.cat; document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.cat===F.cat)); } }
      drawSugg(); return; }
  }
  switch(d.act){
    case 'add': openSheet(); break;
    case 'scan': $('#f-photo')?.click(); break;
    case 'note-add': addNote(); break;
    case 'search-open': S.search=''; S.searchFocused=false; render(); break;
    case 'search-close': S.search=null; render(); break;
    case 'split-on': startSplit(); drawSheet(); break;
    case 'split-off': if(F.split){ F.cat=F.split[0].cat; } F.split=null; drawSheet(); break;
    case 'split-add': F.split.splice(F.split.length-1,0,{cat:'etc', amount:0}); drawSheet(); break;
    case 'stat-clear': S.statWho=''; S.statCat=''; render(); break;
    case 'ev-add': openEvent(null, S.selDay); break;
    case 'ev-add-home': openEvent(null); break;
    case 'ev-close': closeEvent(); break;
    case 'ev-save': { readEvForm(); if(!EV.title){ $('#ev-err').textContent='일정 이름을 적어 주세요.'; break; } if(!EV.date){ $('#ev-err').textContent='날짜를 골라 주세요.'; break; } if(EV.busy) break; EV.busy=true;
      const e={id:EV.id, title:EV.title.slice(0,40), date:EV.date, time:EV.time||'', who:EV.who||'us', yearly:!!EV.yearly, memo:EV.memo.slice(0,80), createdAt:EV.createdAt||Date.now(), updatedAt:Date.now()};
      try{ await store().putEvent(e); closeEvent(); toast('일정을 저장했어요'); }catch(err){ EV.busy=false; $('#ev-err').textContent='저장하지 못했어요. 인터넷 연결을 확인해 주세요.'; } } break;
    case 'ev-del': if(!EV.armed){ EV.armed=true; readEvForm(); drawEvent(); } else { try{ await store().removeEvent(EV.id); closeEvent(); toast('일정을 지웠어요'); }catch(e){ toast('지우지 못했어요'); } } break;
    case 'me-cancel': S.mealEdit=null; render(); break;
    case 'wk-prev': { const d=new Date(curWeek()+'T00:00'); d.setDate(d.getDate()-7); S.week=ymd(d); S.mealEdit=null; render(); } break;
    case 'wk-next': { const d=new Date(curWeek()+'T00:00'); d.setDate(d.getDate()+7); S.week=ymd(d); S.mealEdit=null; render(); } break;
    case 'wk-copy': copyLastWeek(); break;
    case 'wk-shop': makeShopList(); break;
    case 'wk-limit': S.limEdit=!S.limEdit; render(); break;
    case 'wk-limit-save': { const v=+$('#wk-lim-in').value.replace(/\D/g,''); S.limEdit=false; try{ await store().saveSettings({...S.settings, weeklyFood:v}); toast('주간 식비 한도를 저장했어요'); }catch(e){ toast('저장하지 못했어요'); } render(); } break;
    case 'fx-open': closeSheet(); openFixed(); break;
    case 'fx-close': FX=null; $('#sheet').hidden=true; document.body.style.overflow=''; break;
    case 'fx-new': FX.edit={who:'us', cat:'housing'}; FX.armed=false; drawFixed(); break;
    case 'fx-back': FX.edit=null; FX.armed=false; drawFixed(); break;
    case 'fx-save': saveFixed(); break;
    case 'fx-load': loadFixed(); break;
    case 'fx-del': if(!FX.armed){ FX.armed=true; drawFixed(); } else { const list=(S.settings.fixed||[]).filter(x=>x.id!==FX.edit.id); await store().saveSettings({...S.settings, fixed:list}); S.settings.fixed=list; FX.edit=null; FX.armed=false; drawFixed(); toast('삭제했어요'); } break;
    case 'fx-from': { const f={id:uid(), name:(F.memo||catInfo(F.cat).label).slice(0,30), amount:F.amount, day:+F.date.slice(8), cat:F.cat, who:F.who};
      const list=[...(S.settings.fixed||[]), f]; try{ await store().saveSettings({...S.settings, fixed:list}); S.settings.fixed=list; toast(`'${f.name}'을(를) 고정지출로 저장했어요`); }catch(e){ toast('저장하지 못했어요'); } } break;
    case 'note-cancel': S.editNote=null; render(); break;
    case 'bookmode': S.bookMode = S.bookMode==='cal'?'list':'cal'; render(); break;
    case 'caps': $('#f-caps')?.click(); break;
    case 'cap-close': closeCapture(); break;
    case 'cap-save': saveCapture(); break;
    case 'cap-read': readPasted(); break;
    case 'gem-test': geminiTest(); break;
    case 'save-orkey': saveApiKey('openrouter', OR_LS, $('#orkey').value.trim()); break;
    case 'or-test': orTest(); break;
    case 'paste': { const who=F.who; closeSheet(); openPaste(who); } break;
    case 'cap-retry': { const fs=R.files, w=R.who; startCapture(fs,w); } break;
    case 'close': closeSheet(); break;
    case 'save': saveTx(); break;
    case 'del': if(!F.armed){ F.armed=true; drawSheet(); } else { try{ await store().remove(F.id); closeSheet(); toast('삭제했어요'); }catch(e){ $('#f-err').textContent='삭제하지 못했어요. 다시 시도해 주세요.'; } } break;
    case undefined: if(d.day){ S.selDay=d.day; render(); } break;
    case 'prev': S.month=shiftMonth(S.month,-1); render(); break;
    case 'next': S.month=shiftMonth(S.month,1); render(); break;
    case 'clear-ex': await store().removeMany(S.txs.filter(t=>t.ex).map(t=>t.id)); toast('예시를 지웠어요'); break;
    case 'logout': await FireStore.logout(); break;
    case 'csv': case 'csv-copy': exportCsv(d.act==='csv-copy'); break;
    case 'reset': if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent='한 번 더 누르면 모두 지워요'; } else { S.txs=[]; LocalStore.persist(); render(); toast('모두 지웠어요'); } break;
  }
});

function bindSettings(){
  const bud=$('#budget'); bud.oninput=e=>{ const n=+e.target.value.replace(/\D/g,''); e.target.value=n?won(n):''; };
  document.querySelector('[data-act="save-settings"]').onclick=async ()=>{
    const s={...S.settings, names:{a:$('#nm-a').value.trim()||'나', b:$('#nm-b').value.trim()||'배우자'}, budget:+bud.value.replace(/\D/g,''), anniv:$('#anniv').value};
    try{ await store().saveSettings(s); toast('설정을 저장했어요'); }catch(e){ toast('저장하지 못했어요'); }
  };
  document.querySelector('[data-act="save-key"]').onclick=()=>saveApiKey('gemini', GEMINI_LS, $('#gkey').value.trim());
  document.querySelector('[data-act="addcat"]').onclick=async ()=>{
    const label=$('#newcat').value.trim(); if(!label) return;
    const s={...S.settings, customCats:[...(S.settings.customCats||[]), {key:'c_'+uid(), label, type:'out'}]};
    await store().saveSettings(s); toast(`'${label}' 카테고리를 추가했어요`);
  };
  document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=async ()=>{
    const s={...S.settings, customCats:S.settings.customCats.filter(c=>c.key!==b.dataset.delcat)}; await store().saveSettings(s);
  });
}

function exportCsv(copy){
  const rows=[['날짜','구분','카테고리','사람','금액','메모']].concat(
    [...S.txs].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'입금':'지출',catInfo(t.cat).label,whoName(t.who),t.amount,t.memo||'']));
  const csv=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?`"${String(v).replace(/"/g,'""')}"`:v).join(',')).join('\n');
  if(copy){ navigator.clipboard?.writeText(csv).then(()=>toast('내역을 복사했어요'),()=>toast('복사하지 못했어요')); return; }
  const fname=`가계부_${ymd(new Date())}.csv`;
  if(!window.STANDALONE && window.claude){ window.claude.use('downloads').then(dl=>{ if(!dl) return toast('미리보기에서는 내역 복사를 이용해 주세요'); dl.save({filename:fname, data:'\ufeff'+csv}).then(()=>toast('CSV 파일을 저장했어요'),()=>{}); }); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV 파일을 만들었어요');
}

/* ---------------- 시작 ---------------- */


if(S.source==='firebase'){ FireStore.init(); } else { LocalStore.load(); }
render();
if(window.STANDALONE && 'serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
